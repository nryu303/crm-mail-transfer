[Service]
# Spring Boot graceful shutdown for this app routinely takes 30-60s
# (large worker pool + open HTTP connections). The base unit's
# TimeoutStopSec=30 was triggering a SIGKILL on every restart, which
# (a) clobbers in-flight dispatches and (b) corrupts the LaunchedURL
# class loader's view of the jar (NoClassDefFoundError noise in the
# journal during shutdown — old process can't load classes from a jar
# that was just overwritten by `mvn package`).
#
# Raising to 90s gives the graceful shutdown room to actually finish.
# Restart latency under normal restart goes 30→up-to-90s worst case.
TimeoutStopSec=90
