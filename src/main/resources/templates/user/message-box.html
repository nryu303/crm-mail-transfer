<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>メッセージボックス</title>
    <!-- Reuses the exact same stylesheet as the public /reply/{token} page so the admin
         preview renders with identical HTML/CSS, per operator request — no iframe. -->
    <link rel="stylesheet" th:href="@{/css/reply.css}"/>
    <style>
        /* Admin page wraps the reply-shell-styled fragment inside the Tailwind admin chrome;
           give it a max-width and centred card treatment so it doesn't stretch full-bleed. */
        .message-box-admin-wrap { max-width: 720px; margin: 0 auto; }

        /* reply.css sets `body { font-family: ...明朝体(serif)... }` for the PUBLIC /reply/{token}
           page's own look — but this page loads reply.css into the shared admin <body>, which
           also contains the sidebar/nav. Without this override, that serif font leaks onto the
           whole admin chrome (sidebar menu text included), not just the メッセージボックス
           preview area. Restore Tailwind's default sans-serif stack for everything OUTSIDE the
           preview card; the message-box-admin-wrap itself is left alone so the preview still
           renders with the same font the real user-facing page uses. */
        body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .message-box-admin-wrap { font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "MS Mincho", serif; }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1"
            th:text="${(user.displayName != null and !user.displayName.isEmpty() ? user.displayName : user.email) + ' のメッセージボックス'}"></h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
           th:href="@{'/manager/users/' + ${user.id}}">ユーザー詳細に戻る</a>
    </div>

    <div class="message-box-admin-wrap bg-white rounded-lg shadow-sm border border-slate-100 p-4">
        <div th:replace="~{fragment/message-box :: messageBox(${messageBox}, ${inboundBox}, null, true, ${user.id}, ${user.phoneNumber})}"></div>
    </div>
</section>
</body>
</html>
