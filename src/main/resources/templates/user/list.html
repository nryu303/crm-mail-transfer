<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>ユーザー管理</title>
    <style>
        /* Full-height single-screen layout: only the table scrolls. */
        main.flex-1.p-6 { padding: 0 !important; overflow: hidden !important; height: 100vh; display: flex; flex-direction: column; }
        .ulist { display:flex; flex-direction:column; height:100vh; overflow:hidden; background:#f8fafc; }
        .ulist .top-area   { flex-shrink:0; padding:16px 20px 10px; background:#f8fafc; }
        .ulist .table-area { flex:1; overflow:hidden; padding:0 20px; display:flex; flex-direction:column; min-height:0; }
        .ulist .table-outer { flex:1; background:#fff; border:1px solid #e2e8f0; border-radius:8px;
                              box-shadow:0 1px 3px rgba(0,0,0,.05); overflow:hidden; display:flex; flex-direction:column; min-height:0; }
        .ulist .table-scroll { overflow:auto; flex:1; min-height:0; }
        .ulist table { border-collapse:collapse; min-width:1100px; width:100%; }
        .ulist thead th {
            position:sticky; top:0; z-index:4; background:#f8fafc;
            font-size:.68rem; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.04em;
            padding:8px 10px; border-bottom:2px solid #e2e8f0; white-space:nowrap; text-align:left;
        }
        .ulist thead th:nth-child(1), .ulist tbody td:nth-child(1) {
            position:sticky; left:0; z-index:5; background:#f8fafc; width:40px; text-align:center;
        }
        .ulist tbody td:nth-child(1) { background:#fff; z-index:3; }
        .ulist thead th:nth-child(2), .ulist tbody td:nth-child(2) {
            position:sticky; left:40px; z-index:4; background:#f8fafc; border-right:1px solid #e2e8f0; width:52px;
        }
        .ulist tbody td:nth-child(2) { background:#fff; z-index:3; }
        .ulist tbody td { padding:8px 10px; font-size:.81rem; border-bottom:1px solid #f1f5f9;
                          white-space:nowrap; vertical-align:middle; color:#1e293b; }
        .ulist tbody tr:hover td { background:#f8fafc; }
        .ulist tbody tr.selected-row td { background:#eff6ff; }
        .ulist tbody tr.selected-row td:nth-child(1), .ulist tbody tr.selected-row td:nth-child(2) { background:#eff6ff; }
        .ulist .row-check { width:14px; height:14px; accent-color:#2563eb; cursor:pointer; display:block; margin:0 auto; }
        .ulist .pager { flex-shrink:0; padding:8px 0 10px; font-size:.8rem; color:#64748b; }

        .ulist .search-card { background:#fff; border:1px solid #e2e8f0; border-radius:8px;
                              padding:12px 14px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
        .ulist .period-section {
            background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px;
            padding:8px 12px; margin-top:8px;
            display:flex; flex-wrap:wrap; gap:14px; align-items:center;
        }
        .ulist .period-group { display:flex; align-items:center; gap:7px; }
        .ulist .period-label { display:flex; align-items:center; gap:4px;
            font-size:.75rem; font-weight:600; color:#475569; white-space:nowrap; cursor:pointer; user-select:none; }
        .ulist .period-label input[type="checkbox"] { width:13px; height:13px; accent-color:#2563eb; cursor:pointer; }
        .ulist .period-inputs { display:flex; align-items:center; gap:4px; }
        .ulist .period-inputs input[type="datetime-local"] {
            font-size:.74rem; padding:3px 6px; border:1px solid #cbd5e1; border-radius:5px;
            background:#fff; color:#1e293b; outline:none; cursor:pointer; font-family:inherit;
        }
        .ulist .period-inputs input[type="datetime-local"]:focus { border-color:#2563eb; }
        .ulist .period-inputs input[type="datetime-local"]:disabled {
            background:#f1f5f9; color:#94a3b8; cursor:not-allowed; border-color:#e2e8f0;
        }
        .ulist .period-sep { font-size:.74rem; color:#94a3b8; }

        .ulist .page-footer {
            flex-shrink:0; background:#fff; border-top:1px solid #e2e8f0;
            padding:9px 20px; display:flex; align-items:center; justify-content:flex-end; gap:12px;
            box-shadow:0 -1px 4px rgba(0,0,0,.05);
        }
        .ulist .footer-divider { width:1px; height:28px; background:#e2e8f0; flex-shrink:0; }
        .ulist .selected-count { font-size:.78rem; color:#64748b; }
        .ulist .folder-select {
            font-family:inherit; font-size:.78rem; font-weight:500;
            padding:5px 10px; border-radius:5px; border:1px solid #cbd5e1;
            background:#fff; color:#1e293b; outline:none; cursor:pointer; min-width:120px;
        }
        .ulist .folder-select:focus { border-color:#2563eb; }
        .ulist .folder-select:disabled { background:#f1f5f9; color:#94a3b8; cursor:not-allowed; }
        .ulist .btn-move, .ulist .btn-broadcast {
            font-family:inherit; font-size:.82rem; font-weight:700;
            padding:7px 16px; border-radius:6px; border:none; color:#fff; cursor:pointer; white-space:nowrap;
        }
        .ulist .btn-move { background:#059669; box-shadow:0 1px 3px rgba(5,150,105,.25); }
        .ulist .btn-move:hover:not(:disabled) { background:#047857; }
        .ulist .btn-broadcast { background:#2563eb; box-shadow:0 1px 3px rgba(37,99,235,.3); }
        .ulist .btn-broadcast:hover:not(:disabled) { background:#1d4ed8; }
        .ulist .btn-move:disabled, .ulist .btn-broadcast:disabled { background:#94a3b8; cursor:not-allowed; box-shadow:none; }
    </style>
</head>
<body>
<section layout:fragment="content">
<div class="ulist">

    <div class="top-area">
        <div class="flex items-center gap-2 mb-3 flex-wrap">
            <h1 class="text-xl font-bold text-slate-800 flex items-center gap-3">
                ユーザー管理
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-sm font-medium bg-slate-100 text-slate-700"
                      th:text="${users.totalElements} + ' 名'">0 名</span>
                <!-- Status quick-filter, inline with the heading per operator request.
                     The select drives the hidden status field on the main searchForm via JS
                     so it stays bound to the existing search GET parameters. -->
                <label class="inline-flex items-center gap-1 text-xs font-medium text-slate-500 ml-2">
                    ステータス:
                    <select id="statusHeaderFilter" class="tw-input" style="width:auto;font-size:.85rem;padding:2px 24px 2px 8px;"
                            onchange="document.getElementById('searchFormStatus').value=this.value; document.getElementById('searchForm').submit();">
                        <option value="" th:selected="${#strings.isEmpty(searchForm.status)}">すべて</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                th:selected="${s == searchForm.status}"></option>
                    </select>
                </label>
            </h1>
            <div class="flex-1"></div>
            <a class="text-sm px-3 py-1.5 border border-slate-300 text-slate-700 rounded bg-white hover:bg-slate-50"
               th:href="@{/manager/users/import}">CSVインポート</a>
            <a class="text-sm px-3 py-1.5 border border-slate-300 text-slate-700 rounded bg-white hover:bg-slate-50"
               th:href="@{/manager/users/export.csv(email=${searchForm.email},displayName=${searchForm.displayName},status=${searchForm.status},carrierCode=${searchForm.carrierCode},emailDomain=${searchForm.emailDomain},folder=${searchForm.folder})}">CSVエクスポート</a>
            <a class="text-sm px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded shadow-sm"
               th:href="@{/manager/users/new}">新規作成</a>
        </div>

        <div class="search-card">
            <form method="get" th:action="@{/manager/users}" th:object="${searchForm}" id="searchForm">
                <!-- Hidden status input: driven by the header quick-filter; must stay in the form. -->
                <input type="hidden" id="searchFormStatus" th:field="*{status}"/>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">メールアドレス <span class="text-slate-400 font-normal">(改行で複数指定可)</span></label>
                        <textarea class="tw-input" rows="2" th:field="*{email}" style="resize:none;"
                                  placeholder="user1@example.com&#10;user2@example.com"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">表示名 <span class="text-slate-400 font-normal">(改行で複数指定可)</span></label>
                        <textarea class="tw-input" rows="2" th:field="*{displayName}" style="resize:none;"></textarea>
                    </div>
                    <!-- 4 compact selects (フォルダ・広告コード・性別・キャリア) in a single row
                         at ~half the previous width each, with search/clear buttons on the
                         right edge of the same row. -->
                    <div class="md:col-span-2">
                        <div class="flex items-end gap-2 flex-wrap">
                            <div class="min-w-0" style="flex:1 1 0;">
                                <label class="block text-xs text-slate-500 mb-1">フォルダ</label>
                                <select class="tw-input" th:field="*{folder}">
                                    <option value="">すべて</option>
                                    <option value="__NONE__">（未設定）</option>
                                    <option th:each="f : ${folders}" th:value="${f}" th:text="${f}"></option>
                                </select>
                            </div>
                            <div class="min-w-0" style="flex:1 1 0;">
                                <label class="block text-xs text-slate-500 mb-1">広告コード</label>
                                <select class="tw-input" th:field="*{adCode}">
                                    <option value="">すべて</option>
                                    <option value="__NONE__">（未設定）</option>
                                    <option th:each="ac : ${adCodeChoices}" th:value="${ac.code}" th:text="${ac.name} + ' (' + ${ac.code} + ')'"></option>
                                </select>
                            </div>
                            <div class="min-w-0" style="flex:1 1 0;">
                                <label class="block text-xs text-slate-500 mb-1">性別</label>
                                <select class="tw-input" th:field="*{gender}">
                                    <option value="">すべて</option>
                                    <option value="M">男性</option>
                                    <option value="F">女性</option>
                                    <option value="__NONE__">（未設定）</option>
                                </select>
                            </div>
                            <div class="min-w-0" style="flex:1 1 0;">
                                <label class="block text-xs text-slate-500 mb-1">キャリア</label>
                                <select class="tw-input" th:field="*{emailDomain}">
                                    <option value="">すべて</option>
                                    <option th:each="d : ${emailDomains}" th:value="${d}" th:text="'@' + ${d}"></option>
                                </select>
                            </div>
                            <button type="submit" class="inline-flex items-center px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded flex-shrink-0">検索</button>
                            <button type="button" class="inline-flex items-center px-3 py-2 border border-slate-300 bg-white text-slate-600 text-sm rounded hover:bg-slate-50 flex-shrink-0" onclick="window.location='/manager/users'">クリア</button>
                        </div>
                    </div>
                </div>

                <!-- Period filters -->
                <div class="period-section">
                    <span class="text-xs font-bold text-slate-600 whitespace-nowrap">期間絞り込み</span>
                    <div class="period-group">
                        <label class="period-label" for="chk_register">
                            <input type="checkbox" id="chk_register" onchange="togglePeriod('register', this.checked)"
                                   th:checked="${!#strings.isEmpty(searchForm.registerFrom) or !#strings.isEmpty(searchForm.registerTo)}"/>
                            登録期間
                        </label>
                        <div class="period-inputs">
                            <input type="datetime-local" id="register_from" name="registerFrom"
                                   th:value="${!#strings.isEmpty(searchForm.registerFrom)} ? ${searchForm.registerFrom} : ${defaultPeriodFrom}"
                                   th:disabled="${#strings.isEmpty(searchForm.registerFrom) and #strings.isEmpty(searchForm.registerTo)}"/>
                            <span class="period-sep">〜</span>
                            <input type="datetime-local" id="register_to" name="registerTo"
                                   th:value="${!#strings.isEmpty(searchForm.registerTo)} ? ${searchForm.registerTo} : ${defaultPeriodTo}"
                                   th:disabled="${#strings.isEmpty(searchForm.registerFrom) and #strings.isEmpty(searchForm.registerTo)}"/>
                        </div>
                    </div>
                    <div class="period-group">
                        <label class="period-label" for="chk_login">
                            <input type="checkbox" id="chk_login" onchange="togglePeriod('login', this.checked)"
                                   th:checked="${!#strings.isEmpty(searchForm.loginFrom) or !#strings.isEmpty(searchForm.loginTo)}"/>
                            ログイン期間
                        </label>
                        <div class="period-inputs">
                            <input type="datetime-local" id="login_from" name="loginFrom"
                                   th:value="${!#strings.isEmpty(searchForm.loginFrom)} ? ${searchForm.loginFrom} : ${defaultPeriodFrom}"
                                   th:disabled="${#strings.isEmpty(searchForm.loginFrom) and #strings.isEmpty(searchForm.loginTo)}"/>
                            <span class="period-sep">〜</span>
                            <input type="datetime-local" id="login_to" name="loginTo"
                                   th:value="${!#strings.isEmpty(searchForm.loginTo)} ? ${searchForm.loginTo} : ${defaultPeriodTo}"
                                   th:disabled="${#strings.isEmpty(searchForm.loginFrom) and #strings.isEmpty(searchForm.loginTo)}"/>
                        </div>
                    </div>
                    <div class="period-group">
                        <label class="period-label" for="chk_send">
                            <input type="checkbox" id="chk_send" onchange="togglePeriod('send', this.checked)"
                                   th:checked="${!#strings.isEmpty(searchForm.sendFrom) or !#strings.isEmpty(searchForm.sendTo)}"/>
                            返信期間
                        </label>
                        <div class="period-inputs">
                            <input type="datetime-local" id="send_from" name="sendFrom"
                                   th:value="${!#strings.isEmpty(searchForm.sendFrom)} ? ${searchForm.sendFrom} : ${defaultPeriodFrom}"
                                   th:disabled="${#strings.isEmpty(searchForm.sendFrom) and #strings.isEmpty(searchForm.sendTo)}"/>
                            <span class="period-sep">〜</span>
                            <input type="datetime-local" id="send_to" name="sendTo"
                                   th:value="${!#strings.isEmpty(searchForm.sendTo)} ? ${searchForm.sendTo} : ${defaultPeriodTo}"
                                   th:disabled="${#strings.isEmpty(searchForm.sendFrom) and #strings.isEmpty(searchForm.sendTo)}"/>
                        </div>
                    </div>
                    <div class="period-group">
                        <label class="period-label" for="chk_payment">
                            <input type="checkbox" id="chk_payment" onchange="togglePeriod('payment', this.checked)"
                                   th:checked="${!#strings.isEmpty(searchForm.paymentFrom) or !#strings.isEmpty(searchForm.paymentTo)}"/>
                            入金期間
                        </label>
                        <div class="period-inputs">
                            <input type="datetime-local" id="payment_from" name="paymentFrom"
                                   th:value="${!#strings.isEmpty(searchForm.paymentFrom)} ? ${searchForm.paymentFrom} : ${defaultPeriodFrom}"
                                   th:disabled="${#strings.isEmpty(searchForm.paymentFrom) and #strings.isEmpty(searchForm.paymentTo)}"/>
                            <span class="period-sep">〜</span>
                            <input type="datetime-local" id="payment_to" name="paymentTo"
                                   th:value="${!#strings.isEmpty(searchForm.paymentTo)} ? ${searchForm.paymentTo} : ${defaultPeriodTo}"
                                   th:disabled="${#strings.isEmpty(searchForm.paymentFrom) and #strings.isEmpty(searchForm.paymentTo)}"/>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <form id="bulkForm" method="post" class="flex flex-col flex-1 min-h-0">
    <div class="table-area">
        <div class="table-outer">
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr>
                        <th><input type="checkbox" class="row-check" id="checkAll" title="全選択"/></th>
                        <th>No</th>
                        <th>メールアドレス</th>
                        <th>表示名</th>
                        <th>ログインID</th>
                        <th>キャリア</th>
                        <th>ステータス</th>
                        <th>性別</th>
                        <th>広告コード</th>
                        <th>フォルダ</th>
                        <th>登録日時</th>
                        <th>最終ログイン</th>
                        <th>最終返信</th>
                        <th>最終入金日</th>
                        <th class="text-right" style="width:64px;">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${users.totalElements == 0}">
                        <td colspan="15" class="text-center py-6 text-slate-400">該当するユーザーがいません</td>
                    </tr>
                    <tr th:each="u,it : ${users.content}">
                        <td><input type="checkbox" class="row-check row-item" name="ids" th:value="${u.id}"/></td>
                        <!-- Sequential row number based on display order: page offset + 1-based row index.
                             Page 1 row 1 = "1", page 2 row 1 = (size + 1), etc. -->
                        <td><code class="text-xs text-slate-600" th:text="${users.number * users.size + it.count}"></code></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="${u.displayName}"></td>
                        <td>
                            <code class="text-xs text-slate-600" th:if="${u.loginId}" th:text="${u.loginId}"></code>
                            <span th:unless="${u.loginId}" class="text-xs text-slate-400">未発行</span>
                        </td>
                        <td class="text-xs text-slate-500" th:text="${u.carrierDomain} ? ('@' + ${u.carrierDomain}) : '-'"></td>
                        <td>
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                                  th:classappend="${u.status == 'ACTIVE'} ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'"
                                  th:text="${u.status}"></span>
                        </td>
                        <td>
                            <span th:if="${u.gender == 'M'}" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-700">男</span>
                            <span th:if="${u.gender == 'F'}" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-rose-100 text-rose-700">女</span>
                            <span th:if="${u.gender == null or u.gender == ''}" class="text-xs text-slate-400">-</span>
                        </td>
                        <td class="text-xs text-slate-600">
                            <code th:if="${u.adCode}" class="bg-slate-100 px-1.5 py-0.5 rounded text-xs" th:text="${u.adCode}"></code>
                            <span th:unless="${u.adCode}" class="text-slate-400">-</span>
                        </td>
                        <td class="text-xs text-slate-600" th:text="${u.folder} ?: '-'"></td>
                        <td class="text-xs text-slate-500" th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td class="text-xs text-slate-500">
                            <span th:if="${u.lastLoginAt}" th:text="${#temporals.format(u.lastLoginAt, 'yyyy-MM-dd HH:mm')}"></span>
                            <span th:unless="${u.lastLoginAt}" class="text-slate-400">-</span>
                        </td>
                        <td class="text-xs text-slate-500" th:with="ls=${lastSentByUserId.get(u.id)}">
                            <span th:if="${ls != null}" th:text="${#temporals.format(ls, 'yyyy-MM-dd HH:mm')}"></span>
                            <span th:if="${ls == null}" class="text-slate-400">-</span>
                        </td>
                        <td class="text-xs text-slate-500">
                            <span th:if="${u.lastPaymentAt}" th:text="${#temporals.format(u.lastPaymentAt, 'yyyy-MM-dd')}"></span>
                            <span th:unless="${u.lastPaymentAt}" class="text-slate-400">-</span>
                        </td>
                        <td class="text-right">
                            <a class="inline-flex items-center px-3 py-1 text-xs border border-slate-300 text-slate-700 hover:bg-slate-50 rounded" th:href="@{'/manager/users/' + ${u.id}}">編集</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="pager" th:if="${users.totalPages > 0}" style="display:flex; align-items:center; gap:8px; padding:10px 0;">
            <span style="margin-right:auto;">
                全 <strong th:text="${users.totalElements}"></strong> 件
                （<span th:text="${users.number + 1}"></span> / <span th:text="${users.totalPages == 0 ? 1 : users.totalPages}"></span> ページ）
            </span>
            <nav th:if="${users.totalPages > 1}">
                <ul class="flex items-center gap-1 text-sm">
                    <li>
                        <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                           th:classappend="${users.first} ? 'opacity-50 pointer-events-none'"
                           th:href="@{/manager/users(page=${users.number - 1},size=${searchForm.size},email=${searchForm.email},displayName=${searchForm.displayName},emailDomain=${searchForm.emailDomain},status=${searchForm.status},folder=${searchForm.folder})}">前へ</a>
                    </li>
                    <!-- Windowed pagination: first page, an ellipsis,
                         a sliding window of current ± 2, an ellipsis, last page.
                         Avoids the 1..151 wall when totalPages is large. -->
                    <li th:if="${users.number > 2}">
                        <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                           th:href="@{/manager/users(page=0,size=${searchForm.size},email=${searchForm.email},displayName=${searchForm.displayName},emailDomain=${searchForm.emailDomain},status=${searchForm.status},folder=${searchForm.folder})}">1</a>
                    </li>
                    <li th:if="${users.number > 3}" style="color:#94a3b8; padding:0 4px;">…</li>
                    <li th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                        th:if="${i >= users.number - 2 and i <= users.number + 2}">
                        <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                           th:classappend="${i == users.number} ? 'bg-blue-600 text-white border-blue-600'"
                           th:href="@{/manager/users(page=${i},size=${searchForm.size},email=${searchForm.email},displayName=${searchForm.displayName},emailDomain=${searchForm.emailDomain},status=${searchForm.status},folder=${searchForm.folder})}"
                           th:text="${i + 1}"></a>
                    </li>
                    <li th:if="${users.number < users.totalPages - 4}" style="color:#94a3b8; padding:0 4px;">…</li>
                    <li th:if="${users.number < users.totalPages - 3}">
                        <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                           th:href="@{/manager/users(page=${users.totalPages - 1},size=${searchForm.size},email=${searchForm.email},displayName=${searchForm.displayName},emailDomain=${searchForm.emailDomain},status=${searchForm.status},folder=${searchForm.folder})}"
                           th:text="${users.totalPages}"></a>
                    </li>
                    <li>
                        <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                           th:classappend="${users.last} ? 'opacity-50 pointer-events-none'"
                           th:href="@{/manager/users(page=${users.number + 1},size=${searchForm.size},email=${searchForm.email},displayName=${searchForm.displayName},emailDomain=${searchForm.emailDomain},status=${searchForm.status},folder=${searchForm.folder})}">次へ</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <div class="page-footer">
        <span class="selected-count" id="selectedCount"></span>
        <div class="footer-divider"></div>

        <!-- Carrier bulk-bind (left). The leading label was dropped per operator request — the
             dropdown's "全キャリア（一括）" placeholder already conveys the action's scope. -->
        <select class="folder-select" name="poolId" id="poolSelect" disabled>
            <option value="">全キャリア（一括）</option>
            <option th:each="p : ${activePoolAddresses}" th:value="${p.id}"
                    th:text="${p.address} + ' (' + ${p.carrierCode} + ')'"></option>
        </select>
        <button type="submit" class="btn-move" id="btnBindCarrier" disabled
                formaction="/manager/users/bulk-bind-carrier">キャリア登録割り当て</button>
        <button type="submit" class="btn-move btn-bulk-unbind" id="btnUnbindCarrier" disabled
                formaction="/manager/users/bulk-unbind-carrier"
                onclick="return confirm('選択したユーザーの割り当てを解除します。よろしいですか?');">割り当て削除</button>

        <div class="footer-divider"></div>

        <!-- Folder bulk-move -->
        <span class="text-xs font-semibold text-slate-500 whitespace-nowrap">移動先フォルダ</span>
        <select class="folder-select" name="folder" id="folderSelect" disabled>
            <option value="">フォルダを選択</option>
            <option th:each="f : ${folders}" th:value="${f}" th:text="${f}"></option>
            <option value="">（フォルダ解除）</option>
        </select>
        <button type="submit" class="btn-move" id="btnMove" disabled
                formaction="/manager/users/bulk-move-folder">選択フォルダ移動</button>

        <div class="footer-divider"></div>
        <button type="button" class="btn-broadcast" id="btnBroadcast" disabled onclick="goBroadcast()">選択一斉送信</button>

        <div class="footer-divider"></div>
        <button type="submit" class="btn-move" id="btnDelete" disabled
                formaction="/manager/users/bulk-delete"
                onclick="return confirmBulkDelete(this, 'ユーザー');"
                style="background:#dc2626;border-color:#dc2626;color:#fff;">選択削除</button>
    </div>
    </form>

    <!-- All-users carrier-assign (independent of selection — explicit confirmation required) -->
    <form id="bindAllForm" method="post" th:action="@{/manager/users/bulk-bind-all}"
          style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid #e2e8f0;background:#fffbeb;"
          onsubmit="return confirmBindAll();">
        <span style="font-size:.85rem;font-weight:700;color:#92400e;">⚠ 全ユーザーへ一括割り当て:</span>
        <span style="font-size:.78rem;color:#78350f;flex:1;">
            登録済み全ユーザーに、有効な全キャリアアドレスを割り当てます (処理時間: 数分〜十数分)。
        </span>
        <button type="submit" class="btn-broadcast" style="background:#d97706;">全ユーザー割り当て</button>
    </form>

    <!-- Live progress banner for the all-users bind. Hidden when not running. -->
    <div id="bindAllProgress"
         style="display:none;padding:10px 14px;background:#dbeafe;border-top:1px solid #bfdbfe;font-size:.85rem;color:#1e3a8a;position:relative;">
        <strong>📌 全ユーザー割り当て進行中:</strong>
        <span id="bindAllText">準備中...</span>
        <button type="button" id="bindAllClose" onclick="dismissBindAll()"
                style="display:none;position:absolute;top:6px;right:8px;background:transparent;border:0;font-size:1.2rem;cursor:pointer;color:#1e3a8a;line-height:1;padding:0 6px;"
                title="閉じる">×</button>
        <div style="margin-top:6px;background:#fff;height:8px;border-radius:4px;overflow:hidden;border:1px solid #bfdbfe;">
            <div id="bindAllBar" style="width:0%;height:100%;background:#3b82f6;transition:width .3s;"></div>
        </div>
    </div>
</div>

<script>
// --- Period toggles ---
function togglePeriod(key, enabled) {
    var map = {
        register:['register_from','register_to'],
        login:['login_from','login_to'],
        send:['send_from','send_to'],
        payment:['payment_from','payment_to']
    };
    (map[key] || []).forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.disabled = !enabled;
        if (!enabled) el.removeAttribute('name'); // un-checked group must not POST a value
        else el.setAttribute('name', el.id.endsWith('_from')
                ? key + 'From' : key + 'To');
    });
}
// On page load, sync name attributes for checked/unchecked groups so unfilled defaults
// don't accidentally narrow the result set when the user just hits 検索 with no checks.
document.addEventListener('DOMContentLoaded', function () {
    ['register','login','send','payment'].forEach(function (k) {
        var chk = document.getElementById('chk_' + k);
        if (chk) togglePeriod(k, chk.checked);
    });
});

// --- Selection footer ---
(function () {
    var checkAll = document.getElementById('checkAll');
    var countLabel = document.getElementById('selectedCount');
    var folderSel = document.getElementById('folderSelect');
    var btnMove = document.getElementById('btnMove');
    var btnBroad = document.getElementById('btnBroadcast');

    function rows() { return document.querySelectorAll('.row-item'); }

    var poolSel = document.getElementById('poolSelect');
    var btnBindCarrier = document.getElementById('btnBindCarrier');
    var btnUnbindCarrier = document.getElementById('btnUnbindCarrier');
    var btnDelete = document.getElementById('btnDelete');
    function refresh() {
        var checked = [].filter.call(rows(), function (c) { return c.checked; });
        var has = checked.length > 0;
        countLabel.textContent = has ? (checked.length + ' 件選択中') : '';
        folderSel.disabled = !has;
        btnMove.disabled = !has;
        btnBroad.disabled = !has;
        if (poolSel)          poolSel.disabled = !has;
        if (btnBindCarrier)   btnBindCarrier.disabled = !has;
        if (btnUnbindCarrier) btnUnbindCarrier.disabled = !has;
        if (btnDelete)        btnDelete.disabled = !has;
        checkAll.indeterminate = has && checked.length < rows().length;
        checkAll.checked = rows().length > 0 && checked.length === rows().length;
    }
    if (checkAll) checkAll.addEventListener('change', function () {
        [].forEach.call(rows(), function (c) {
            c.checked = checkAll.checked;
            var tr = c.closest('tr'); if (tr) tr.classList.toggle('selected-row', checkAll.checked);
        });
        refresh();
    });
    document.addEventListener('change', function (e) {
        if (!e.target.classList || !e.target.classList.contains('row-item')) return;
        var tr = e.target.closest('tr'); if (tr) tr.classList.toggle('selected-row', e.target.checked);
        refresh();
    });

    window.confirmBindAll = function () {
        if (!confirm('登録済みの全ユーザーへ全キャリアアドレスを一括割り当てします。\n処理に数分〜十数分かかります。\nよろしいですか?')) return false;
        return confirm('本当に実行しますか? メモリ負荷の高い処理のため、終わるまで一斉送信などの操作は控えてください。');
    };

    // --- Live progress poller for /bulk-bind-all ---
    window.dismissBindAll = function () {
        fetch('/manager/users/bulk-bind-all/clear', {method:'POST', credentials:'same-origin'})
            .then(function(r){ return r.json(); })
            .then(function(d){
                if (d.ok) {
                    document.getElementById('bindAllProgress').style.display = 'none';
                } else {
                    alert('処理がまだ実行中です。完了までお待ちください。');
                }
            })
            .catch(function(){});
    };

    (function () {
        var panel = document.getElementById('bindAllProgress');
        var txt   = document.getElementById('bindAllText');
        var bar   = document.getElementById('bindAllBar');
        var btnClose = document.getElementById('bindAllClose');
        function poll() {
            fetch('/manager/users/bulk-bind-all/progress', {credentials:'same-origin'})
                .then(function(r){ return r.json(); })
                .then(function(d){
                    var pct = d.total > 0 ? Math.min(100, (d.progress / d.total) * 100) : 0;
                    bar.style.width = pct + '%';
                    if (d.running) {
                        panel.style.display = '';
                        btnClose.style.display = 'none';  // can't dismiss while running
                        txt.textContent = d.progress + ' / ' + d.total + ' 名処理済み (新規 ' + d.created + ' 件)';
                        setTimeout(poll, 2000);
                    } else if (d.message) {
                        panel.style.display = '';
                        btnClose.style.display = '';      // show × so operator can dismiss
                        txt.textContent = '✅ 完了: ' + d.message;
                    } else {
                        panel.style.display = 'none';
                    }
                })
                .catch(function(){ setTimeout(poll, 5000); });
        }
        poll();
    })();

    window.goBroadcast = function () {
        // POST-then-redirect because at 500+ selected users the GET URL exceeded
        // Tomcat's default 8KB header limit and the browser navigation silently failed.
        // The server stashes the IDs in the HTTP session and redirects to the form.
        var ids = [].filter.call(rows(), function (c) { return c.checked; }).map(function (c) { return c.value; });
        if (ids.length === 0) {
            window.location.href = '/manager/messages/broadcast/new';
            return;
        }
        var f = document.createElement('form');
        f.method = 'POST';
        f.action = '/manager/messages/broadcast/new';
        // CSRF token: pick it up from the existing bulkForm so the request is accepted.
        var bulk = document.getElementById('bulkForm');
        if (bulk) {
            var csrf = bulk.querySelector('input[name="_csrf"]');
            if (csrf) {
                var h = document.createElement('input');
                h.type = 'hidden'; h.name = '_csrf'; h.value = csrf.value;
                f.appendChild(h);
            }
        }
        ids.forEach(function (id) {
            var i = document.createElement('input');
            i.type = 'hidden'; i.name = 'userIds'; i.value = id;
            f.appendChild(i);
        });
        document.body.appendChild(f);
        f.submit();
    };

    // Double-confirmation for bulk delete + admin-password prompt. Returns true to submit.
    window.confirmBulkDelete = function (btn, label) {
        var checked = [].filter.call(rows(), function (c) { return c.checked; });
        var n = checked.length;
        if (n === 0) return false;
        if (!confirm('選択した ' + n + ' 件の' + label + 'を削除します。よろしいですか?')) return false;
        if (!confirm('本当に削除してよろしいですか? この操作は取り消せません。')) return false;
        var pw = prompt('管理者パスワードを入力してください');
        if (!pw) return false;
        var form = btn.form || document.getElementById('bulkForm');
        if (!form) return false;
        var hidden = form.querySelector('input[name="confirmPassword"]');
        if (!hidden) {
            hidden = document.createElement('input');
            hidden.type = 'hidden'; hidden.name = 'confirmPassword';
            form.appendChild(hidden);
        }
        hidden.value = pw;
        return true;
    };
})();
</script>
</section>
</body>
</html>
