<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>キャリアプールCSVインポート</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">キャリアプールCSVインポート</h1>
        <a class="text-sm text-blue-600 hover:underline" th:href="@{/manager/carrier-pool}">一覧に戻る</a>
    </div>

    <div class="max-w-3xl rounded-md border border-sky-200 bg-sky-50 px-4 py-3 text-sm text-sky-800 mb-4">
        <strong>CSV形式 (UTF-8)</strong><br/>
        1行目: ヘッダー行 <code class="bg-white px-1 py-0.5 rounded border border-sky-200">address,carrier_code,carrier_domain,smtp_host,smtp_port,smtp_username,smtp_password</code><br/>
        2行目以降: データ行<br/>
        既存のアドレスと重複する行はスキップされます。SMTPパスワードはAES-256で暗号化して保存します。
    </div>

    <form method="post" th:action="@{/manager/carrier-pool/import}" enctype="multipart/form-data"
          class="max-w-3xl bg-white rounded-lg shadow-sm border border-slate-100 p-6 mb-4">
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">CSVファイル</label>
            <input type="file" name="file" accept=".csv,text/csv" class="tw-input" required/>
        </div>
        <button type="submit" class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow-sm">インポート実行</button>
    </form>

    <div th:if="${result}" class="max-w-3xl bg-white rounded-lg shadow-sm border border-slate-100 p-6">
        <h2 class="text-base font-semibold text-slate-800 mb-3">インポート結果</h2>
        <div class="grid grid-cols-4 gap-3 text-center mb-4">
            <div><div class="text-xs text-slate-500">取込行数</div><div class="text-2xl font-bold" th:text="${result.totalRows}"></div></div>
            <div><div class="text-xs text-slate-500">成功</div><div class="text-2xl font-bold text-emerald-600" th:text="${result.successCount}"></div></div>
            <div><div class="text-xs text-slate-500">重複スキップ</div><div class="text-2xl font-bold text-slate-500" th:text="${result.duplicateCount}"></div></div>
            <div><div class="text-xs text-slate-500">エラー</div><div class="text-2xl font-bold text-red-600" th:text="${result.errorCount}"></div></div>
        </div>
        <div th:if="${!result.errors.empty}">
            <h3 class="text-sm font-semibold text-slate-700 mb-2">エラー詳細</h3>
            <table class="w-full text-sm border border-slate-200">
                <thead class="bg-slate-50 text-xs text-slate-500 uppercase"><tr><th class="px-3 py-1 text-left" style="width: 80px;">行番号</th><th class="px-3 py-1 text-left">エラー内容</th></tr></thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="e : ${result.errors}">
                    <td class="px-3 py-1" th:text="${e.rowNumber}"></td>
                    <td class="px-3 py-1" th:text="${e.reason}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
