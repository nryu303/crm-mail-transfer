<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>キャリア登録割り当て</title>
    <style>
        .list-page-footer {
            flex-shrink:0; background:#fff; border-top:1px solid #e2e8f0;
            padding:9px 20px; display:flex; align-items:center; justify-content:flex-end; gap:12px;
            box-shadow:0 -1px 4px rgba(0,0,0,.05); margin-top:12px;
        }
        .list-page-footer .selected-count { font-size:.78rem; color:#64748b; }
        .list-page-footer .btn-bulk-delete {
            font-family:inherit; font-size:.82rem; font-weight:700;
            padding:7px 16px; border-radius:6px; border:none; color:#fff; cursor:pointer; white-space:nowrap;
            background:#dc2626; box-shadow:0 1px 3px rgba(220,38,38,.25);
        }
        .list-page-footer .btn-bulk-delete:hover:not(:disabled) { background:#b91c1c; }
        .list-page-footer .btn-bulk-delete:disabled { background:#94a3b8; cursor:not-allowed; box-shadow:none; }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">キャリア登録割り当て</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md mr-2" th:href="@{/manager/carrier-pool/import}">CSVインポート</a>
        <a class="inline-flex items-center px-3 py-1.5 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-md shadow-sm" th:href="@{/manager/carrier-pool/new}">新規追加</a>
    </div>

    <div th:if="${unboundCount != null and unboundCount > 0}"
         class="mb-4 rounded-md border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900">
        <strong>どのユーザーにも紐付いていないアドレスが <span th:text="${unboundCount}">0</span> 件あります。</strong>
        これらのアドレス宛てに届く受信メールはスレッドに保存されず破棄されます。
        すべてのユーザーをすべてのアドレスに紐付けるには、各ユーザーの詳細画面で「キャリア登録割り当て」を実行してください。
    </div>

    <form class="bg-white rounded-lg shadow-sm border border-slate-100 p-4 mb-4" method="get" th:action="@{/manager/carrier-pool}" th:object="${searchForm}">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
            <div>
                <label class="block text-xs text-slate-500 mb-1">アドレス <span class="text-slate-400 normal-case">(改行で複数指定可)</span></label>
                <textarea class="tw-input" rows="3" th:field="*{address}" placeholder="addr1@i.softbank.jp&#10;addr2@docomo.ne.jp"></textarea>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">キャリア</label>
                <select class="tw-input" th:field="*{carrierCode}">
                    <option value="">すべて</option>
                    <option th:each="c : ${carrierCodes}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">割当状況</label>
                <select class="tw-input" th:field="*{boundFilter}">
                    <option value="">すべて</option>
                    <option value="BOUND">割当済み</option>
                    <option value="UNBOUND">未割当</option>
                </select>
            </div>
            <div class="flex gap-2">
                <button type="submit" class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow-sm">検索</button>
                <button type="button" class="inline-flex items-center px-4 py-2 border border-slate-300 bg-white text-slate-600 text-sm rounded-md hover:bg-slate-50" onclick="window.location='/manager/carrier-pool'">クリア</button>
            </div>
        </div>
        <div class="mt-3 flex items-center">
            <input type="checkbox" class="h-4 w-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500"
                   id="showInactive" th:field="*{showInactive}"/>
            <label class="ml-2 text-xs text-slate-500" for="showInactive">
                削除済み(無効化)のアドレスも表示する — ユーザーとの紐付けは維持されているため一覧からは通常非表示です
            </label>
        </div>
    </form>

    <form id="poolBulkForm" method="post">
    <div class="bg-white rounded-lg shadow-sm border border-slate-100 overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50 text-xs text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-3 py-2 text-left" style="width: 36px;"><input type="checkbox" id="poolCheckAll" title="全選択"/></th>
                <th class="px-3 py-2 text-left" style="width: 60px;">No</th>
                <th class="px-3 py-2 text-left">アドレス</th>
                <th class="px-3 py-2 text-left">キャリア</th>
                <th class="px-3 py-2 text-left">SMTP</th>
                <th class="px-3 py-2 text-left">割当ユーザー数</th>
                <th class="px-3 py-2 text-left">有効</th>
                <th class="px-3 py-2 text-right">操作</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:if="${pools.totalElements == 0}">
                <td colspan="8" class="px-3 py-6 text-center text-slate-400">登録されているキャリアアドレスがありません</td>
            </tr>
            <tr th:each="p,it : ${pools.content}" class="hover:bg-slate-50">
                <td class="px-3 py-2"><input type="checkbox" class="pool-row-item" name="ids" th:value="${p.id}"/></td>
                <td class="px-3 py-2"><code class="text-xs text-slate-600" th:text="${pools.number * pools.size + it.count}"></code></td>
                <td class="px-3 py-2"><code class="bg-slate-100 px-1.5 py-0.5 rounded text-xs" th:text="${p.address}"></code></td>
                <td class="px-3 py-2 text-slate-700">
                    <span th:text="${p.carrierCode}"></span>
                    <span class="text-xs text-slate-500" th:text="'@' + ${p.carrierDomain}"></span>
                </td>
                <td class="px-3 py-2 text-xs text-slate-500">
                    <span th:text="${p.smtpHost}"></span>:<span th:text="${p.smtpPort}"></span>
                </td>
                <td class="px-3 py-2" th:with="bc=${poolBindCounts.get(p.id)}">
                    <span th:if="${bc != null and bc > 0}"
                          class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-sky-100 text-sky-700"
                          th:text="${bc} + 'ユーザー'"></span>
                    <span th:unless="${bc != null and bc > 0}" class="text-xs text-slate-400">未割当</span>
                </td>
                <td class="px-3 py-2">
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                          th:classappend="${p.isActive} ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'"
                          th:text="${p.isActive} ? 'ACTIVE' : 'INACTIVE'"></span>
                </td>
                <td class="px-3 py-2 text-right">
                    <a class="inline-flex items-center px-3 py-1 text-xs border border-slate-300 text-slate-700 hover:bg-slate-50 rounded"
                       th:href="@{'/manager/carrier-pool/' + ${p.id} + '/edit'}">編集</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-4" th:if="${pools.totalPages > 1}">
        <ul class="flex items-center gap-1 text-sm">
            <li>
                <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                   th:classappend="${pools.first} ? 'opacity-50 pointer-events-none'"
                   th:href="@{/manager/carrier-pool(page=${pools.number - 1},address=${searchForm.address},carrierCode=${searchForm.carrierCode},boundFilter=${searchForm.boundFilter},showInactive=${searchForm.showInactive})}">前へ</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, pools.totalPages - 1)}">
                <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                   th:classappend="${i == pools.number} ? 'bg-blue-600 text-white border-blue-600'"
                   th:href="@{/manager/carrier-pool(page=${i},address=${searchForm.address},carrierCode=${searchForm.carrierCode},boundFilter=${searchForm.boundFilter},showInactive=${searchForm.showInactive})}" th:text="${i + 1}"></a>
            </li>
            <li>
                <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                   th:classappend="${pools.last} ? 'opacity-50 pointer-events-none'"
                   th:href="@{/manager/carrier-pool(page=${pools.number + 1},address=${searchForm.address},carrierCode=${searchForm.carrierCode},boundFilter=${searchForm.boundFilter},showInactive=${searchForm.showInactive})}">次へ</a>
            </li>
        </ul>
    </nav>
    <p class="mt-3 text-sm text-slate-500">
        全<span th:text="${pools.totalElements}">0</span>件
    </p>

    <div class="list-page-footer">
        <span class="selected-count" id="poolSelectedCount"></span>
        <button type="submit" class="btn-bulk-delete" id="btnPoolDelete" disabled
                formaction="/manager/carrier-pool/bulk-delete"
                onclick="return confirmBulkDeletePool();">選択削除</button>
    </div>
    </form>
<script>
(function () {
    var checkAll = document.getElementById('poolCheckAll');
    var btnDelete = document.getElementById('btnPoolDelete');
    var countLabel = document.getElementById('poolSelectedCount');
    function rows() { return document.querySelectorAll('.pool-row-item'); }
    function refresh() {
        var checked = [].filter.call(rows(), function (c) { return c.checked; });
        var has = checked.length > 0;
        countLabel.textContent = has ? (checked.length + ' 件選択中') : '';
        btnDelete.disabled = !has;
        if (checkAll) {
            checkAll.indeterminate = has && checked.length < rows().length;
            checkAll.checked = rows().length > 0 && checked.length === rows().length;
        }
    }
    if (checkAll) checkAll.addEventListener('change', function () {
        [].forEach.call(rows(), function (c) { c.checked = checkAll.checked; });
        refresh();
    });
    document.addEventListener('change', function (e) {
        if (e.target.classList && e.target.classList.contains('pool-row-item')) refresh();
    });
    window.confirmBulkDeletePool = function () {
        var n = [].filter.call(rows(), function (c) { return c.checked; }).length;
        if (n === 0) return false;
        if (!confirm('選択した ' + n + ' 件のキャリアアドレスを削除します。ユーザーとの紐付けは維持され、過去に送信済みのメッセージへの返信は引き続き届きます。よろしいですか?')) return false;
        if (!confirm('本当に削除してよろしいですか? 編集画面からいつでも再度有効化できます。')) return false;
        var pw = prompt('管理者パスワードを入力してください');
        if (!pw) return false;
        var f = document.getElementById('poolBulkForm');
        var h = f.querySelector('input[name="confirmPassword"]');
        if (!h) { h = document.createElement('input'); h.type='hidden'; h.name='confirmPassword'; f.appendChild(h); }
        h.value = pw;
        return true;
    };
})();
</script>
</section>
</body>
</html>
