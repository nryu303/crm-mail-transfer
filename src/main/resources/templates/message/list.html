<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>メッセージ</title>
    <style>
        .list-page-footer {
            flex-shrink:0; background:#fff; border-top:1px solid #e2e8f0;
            padding:9px 20px; display:flex; align-items:center; justify-content:flex-end; gap:12px;
            box-shadow:0 -1px 4px rgba(0,0,0,.05); margin-top:12px;
        }
        .list-page-footer .selected-count { font-size:.78rem; color:#64748b; }
        .list-page-footer .btn-bulk-delete {
            font-family:inherit; font-size:.82rem; font-weight:700;
            padding:7px 16px; border-radius:6px; border:none; color:#fff; cursor:pointer; white-space:nowrap;
            background:#dc2626; box-shadow:0 1px 3px rgba(220,38,38,.25);
        }
        .list-page-footer .btn-bulk-delete:hover:not(:disabled) { background:#b91c1c; }
        .list-page-footer .btn-bulk-delete:disabled { background:#94a3b8; cursor:not-allowed; box-shadow:none; }
        .col-body { max-width:280px; }
        .col-body .body-text {
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
            overflow:hidden; line-height:1.35; font-size:.78rem; color:#475569; white-space:pre-wrap;
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-1 flex-wrap gap-2">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">個別メッセージ管理</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
           th:href="@{/manager/messages/broadcast}">一斉送信履歴 →</a>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md" th:href="@{/manager/messages/export.csv(tab=${tab})}">CSVエクスポート</a>
    </div>
    <p class="text-xs text-slate-500 mb-4">
        SMS送信・予約送信・個別の受信返信のみを表示しています。
        一斉送信は <a class="text-blue-600 hover:underline" th:href="@{/manager/messages/broadcast}">一斉送信履歴</a> からご確認ください。
    </p>

    <nav class="mb-4 border-b border-slate-200">
        <ul class="flex flex-wrap -mb-px text-sm">
            <li>
                <a class="inline-block px-4 py-2 border-b-2 font-medium"
                   th:classappend="${tab == 'all'} ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'"
                   th:href="@{/manager/messages}">すべて</a>
            </li>
            <li>
                <a class="inline-block px-4 py-2 border-b-2 font-medium"
                   th:classappend="${tab == 'sent'} ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'"
                   th:href="@{/manager/messages(tab='sent')}">送信履歴</a>
            </li>
            <li>
                <a class="inline-block px-4 py-2 border-b-2 font-medium"
                   th:classappend="${tab == 'scheduled'} ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'"
                   th:href="@{/manager/messages(tab='scheduled')}">予約送信履歴</a>
            </li>
            <li>
                <a class="inline-block px-4 py-2 border-b-2 font-medium"
                   th:classappend="${tab == 'reply'} ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'"
                   th:href="@{/manager/messages(tab='reply')}">返信履歴</a>
            </li>
            <li>
                <a class="inline-block px-4 py-2 border-b-2 font-medium"
                   th:classappend="${tab == 'scheduled-reply'} ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'"
                   th:href="@{/manager/messages(tab='scheduled-reply')}">予約返信履歴</a>
            </li>
            <li>
                <a class="inline-block px-4 py-2 border-b-2 font-medium"
                   th:classappend="${tab == 'inbound'} ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'"
                   th:href="@{/manager/messages(tab='inbound')}">ユーザーからの受信</a>
            </li>
        </ul>
    </nav>

    <form id="msgBulkForm" method="post">
    <input type="hidden" name="tab" th:value="${tab}"/>
    <div class="bg-white rounded-lg shadow-sm border border-slate-100 overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50 text-xs text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-3 py-2 text-left" style="width: 36px;"><input type="checkbox" id="msgCheckAll" title="全選択"/></th>
                <th class="px-3 py-2 text-left" style="width: 60px;">No</th>
                <th class="px-3 py-2 text-left" style="width: 90px;">種別</th>
                <th class="px-3 py-2 text-left">メールアドレス</th>
                <th class="px-3 py-2 text-left">表示名</th>
                <th class="px-3 py-2 text-left">広告コード</th>
                <th class="px-3 py-2 text-left">フォルダ</th>
                <th class="px-3 py-2 text-left">件名</th>
                <th class="px-3 py-2 text-left col-body">本文</th>
                <th class="px-3 py-2 text-left" style="width: 110px;">ステータス</th>
                <th class="px-3 py-2 text-left" style="width: 130px;">予約日時</th>
                <th class="px-3 py-2 text-left" style="width: 130px;">送信/受信日時</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:if="${messages.totalElements == 0}">
                <td colspan="12" class="px-3 py-6 text-center text-slate-400">該当するメッセージはありません</td>
            </tr>
            <tr th:each="m,it : ${messages.content}" class="hover:bg-slate-50">
                <td class="px-3 py-2"><input type="checkbox" class="msg-row-item" name="ids" th:value="${m.id}"/></td>
                <td class="px-3 py-2"><code class="text-xs text-slate-600" th:text="${messages.number * messages.size + it.count}"></code></td>
                <td class="px-3 py-2">
                    <span th:if="${m.direction == 'OUT' and m.channel == 'SMS'}"
                          class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-100 text-yellow-800"
                          title="SMS送信">SMS送信</span>
                    <span th:if="${m.direction == 'OUT' and m.channel != 'SMS'}" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-700">送信</span>
                    <span th:if="${m.direction == 'IN' and m.channel == 'EMAIL'}"
                          class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-200 text-slate-700"
                          title="ユーザーからの直接メール返信">メール返信</span>
                    <span th:if="${m.direction == 'IN' and m.channel == 'WEB_REPLY'}"
                          class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-sky-100 text-sky-700"
                          title="返信URLからのフォーム返信">Web返信</span>
                    <span th:if="${m.direction == 'IN' and m.channel == 'SMS'}"
                          class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-100 text-yellow-800"
                          title="ユーザーからのSMS返信">SMS返信</span>
                </td>
                <td class="px-3 py-2 text-xs">
                    <a class="text-blue-600 hover:underline whitespace-nowrap"
                       th:href="@{'/manager/users/' + ${m.userId}}" target="_blank"
                       th:text="${userEmails != null and userEmails.get(m.userId) != null} ? ${userEmails.get(m.userId)} : ('No.' + ${m.userId})"></a>
                </td>
                <td class="px-3 py-2 text-xs text-slate-700 whitespace-nowrap"
                    th:text="${userDisplayNames != null and userDisplayNames.get(m.userId) != null} ? ${userDisplayNames.get(m.userId)} : '-'"></td>
                <td class="px-3 py-2 text-xs text-slate-500"
                    th:text="${userAdCodes != null and userAdCodes.get(m.userId) != null} ? ${userAdCodes.get(m.userId)} : '-'"></td>
                <td class="px-3 py-2 text-xs text-slate-500"
                    th:text="${userFolders != null and userFolders.get(m.userId) != null} ? ${userFolders.get(m.userId)} : '-'"></td>
                <td class="px-3 py-2 text-xs text-slate-700 truncate" style="max-width: 200px;" th:text="${m.subject} ?: '(件名なし)'"></td>
                <td class="px-3 py-2 col-body">
                    <div class="body-text" th:text="${m.bodyText}"></div>
                </td>
                <td class="px-3 py-2">
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                          th:classappend="${m.status == 'SENT' or m.status == 'DELIVERED'} ? 'bg-emerald-100 text-emerald-700'
                                           : (${m.status == 'QUEUED'} ? 'bg-sky-100 text-sky-700'
                                           : (${m.status == 'FAILED'} ? 'bg-red-100 text-red-700'
                                           : (${m.status == 'CANCELLED'} ? 'bg-slate-200 text-slate-600' : 'bg-slate-100 text-slate-600')))"
                          th:text="${m.status}"></span>
                </td>
                <td class="px-3 py-2 text-xs text-slate-500 whitespace-nowrap">
                    <span th:if="${m.scheduledAt != null}" th:text="${#temporals.format(m.scheduledAt, 'yyyy-MM-dd HH:mm')}"></span>
                    <span th:unless="${m.scheduledAt != null}" class="text-slate-300">-</span>
                </td>
                <td class="px-3 py-2 text-xs text-slate-500 whitespace-nowrap">
                    <span th:if="${m.sentAt != null}" th:text="${#temporals.format(m.sentAt, 'yyyy-MM-dd HH:mm')}"></span>
                    <span th:unless="${m.sentAt != null}" th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-4" th:if="${messages.totalPages > 1}">
        <ul class="flex items-center gap-1 text-sm">
            <li>
                <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                   th:classappend="${messages.first} ? 'opacity-50 pointer-events-none'"
                   th:href="@{/manager/messages(page=${messages.number - 1},tab=${tab})}">前へ</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, messages.totalPages - 1)}">
                <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                   th:classappend="${i == messages.number} ? 'bg-blue-600 text-white border-blue-600'"
                   th:href="@{/manager/messages(page=${i},tab=${tab})}" th:text="${i + 1}"></a>
            </li>
            <li>
                <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                   th:classappend="${messages.last} ? 'opacity-50 pointer-events-none'"
                   th:href="@{/manager/messages(page=${messages.number + 1},tab=${tab})}">次へ</a>
            </li>
        </ul>
    </nav>
    <p class="mt-3 text-sm text-slate-500">全<span th:text="${messages.totalElements}">0</span>件</p>

    <div class="list-page-footer">
        <span class="selected-count" id="msgSelectedCount"></span>
        <button type="submit" class="btn-bulk-delete" id="btnMsgDelete" disabled
                formaction="/manager/messages/bulk-delete"
                onclick="return confirmBulkDeleteMsg('メッセージ');">選択削除</button>
    </div>
    </form>

<script>
(function () {
    var checkAll = document.getElementById('msgCheckAll');
    var btnDelete = document.getElementById('btnMsgDelete');
    var countLabel = document.getElementById('msgSelectedCount');
    function rows() { return document.querySelectorAll('.msg-row-item'); }
    function refresh() {
        var checked = [].filter.call(rows(), function (c) { return c.checked; });
        var has = checked.length > 0;
        countLabel.textContent = has ? (checked.length + ' 件選択中') : '';
        btnDelete.disabled = !has;
        if (checkAll) {
            checkAll.indeterminate = has && checked.length < rows().length;
            checkAll.checked = rows().length > 0 && checked.length === rows().length;
        }
    }
    if (checkAll) checkAll.addEventListener('change', function () {
        [].forEach.call(rows(), function (c) { c.checked = checkAll.checked; });
        refresh();
    });
    document.addEventListener('change', function (e) {
        if (e.target.classList && e.target.classList.contains('msg-row-item')) refresh();
    });
    window.confirmBulkDeleteMsg = function (label) {
        var n = [].filter.call(rows(), function (c) { return c.checked; }).length;
        if (n === 0) return false;
        if (!confirm('選択した ' + n + ' 件の' + label + 'を削除します。よろしいですか?')) return false;
        if (!confirm('本当に削除してよろしいですか? この操作は取り消せません。')) return false;
        var pw = prompt('管理者パスワードを入力してください');
        if (!pw) return false;
        var f = document.getElementById('msgBulkForm');
        var h = f.querySelector('input[name="confirmPassword"]');
        if (!h) { h = document.createElement('input'); h.type='hidden'; h.name='confirmPassword'; f.appendChild(h); }
        h.value = pw;
        return true;
    };
})();
</script>
</section>
</body>
</html>
