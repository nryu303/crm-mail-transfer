<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>一斉送信返信履歴</title>
    <style>
        .search-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .search-bar input[type="text"] {
            padding:6px 10px; border:1px solid #cbd5e1; border-radius:6px; font-size:.85rem;
            min-width:260px; outline:none;
        }
        .search-bar input[type="text"]:focus { border-color:#2563eb; }
        .search-bar .btn { padding:6px 14px; border-radius:6px; font-size:.82rem; font-weight:600; border:1px solid transparent; cursor:pointer; }
        .search-bar .btn.primary { background:#2563eb; color:#fff; }
        .search-bar .btn.primary:hover { background:#1d4ed8; }
        .search-bar .btn.ghost { background:#fff; border-color:#cbd5e1; color:#475569; }
        .search-bar .btn.ghost:hover { background:#f1f5f9; }
        .col-body { max-width:280px; }
        .col-body .body-text {
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
            overflow:hidden; line-height:1.35; font-size:.78rem; color:#475569; white-space:pre-wrap;
        }
        .list-page-footer {
            flex-shrink:0; background:#fff; border-top:1px solid #e2e8f0;
            padding:9px 20px; display:flex; align-items:center; justify-content:flex-end; gap:12px;
            box-shadow:0 -1px 4px rgba(0,0,0,.05); margin-top:12px;
        }
        .list-page-footer .selected-count { font-size:.78rem; color:#64748b; }
        .list-page-footer .btn-bulk-delete {
            font-family:inherit; font-size:.82rem; font-weight:700;
            padding:7px 16px; border-radius:6px; border:none; color:#fff; cursor:pointer; white-space:nowrap;
            background:#dc2626; box-shadow:0 1px 3px rgba(220,38,38,.25);
        }
        .list-page-footer .btn-bulk-delete:hover:not(:disabled) { background:#b91c1c; }
        .list-page-footer .btn-bulk-delete:disabled { background:#94a3b8; cursor:not-allowed; box-shadow:none; }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4 flex-wrap gap-2">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1"
            th:text="${channel == 'SMS'} ? 'SMS配信履歴' : '一斉送信返信履歴'">一斉送信返信履歴</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
           th:href="@{/manager/messages}">← 個別メッセージ管理へ</a>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
           th:href="@{/manager/messages/broadcast/summary}">一斉送信サマリー</a>
    </div>

    <!-- Flash messages -->
    <div th:if="${flashSuccess}" class="mb-3 px-4 py-2 rounded-md bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm" th:text="${flashSuccess}"></div>
    <div th:if="${flashError}" class="mb-3 px-4 py-2 rounded-md bg-red-50 border border-red-200 text-red-700 text-sm" th:text="${flashError}"></div>

    <!-- Address search bar -->
    <form method="get" th:action="@{/manager/messages/broadcast}" class="bg-white rounded-lg shadow-sm border border-slate-100 p-3 mb-4">
        <div class="search-bar">
            <label class="text-xs text-slate-500 font-semibold"
                   th:text="${channel == 'SMS'} ? '番号検索:' : 'アドレス検索:'">アドレス検索:</label>
            <input type="text" name="addr" th:value="${addr}"
                   th:placeholder="${channel == 'SMS'} ? '宛先の電話番号で絞り込み (部分一致)' : '宛先 / FROM のメールアドレスで絞り込み (部分一致)'"/>
            <input type="hidden" name="channel" th:value="${channel}"/>
            <button type="submit" class="btn primary">検索</button>
            <a class="btn ghost" th:href="@{/manager/messages/broadcast}" th:if="${addr != null and addr != ''}">クリア</a>
            <span class="ml-auto text-xs text-slate-400">
                全 <span th:text="${messages.totalElements}">0</span> 件
            </span>
        </div>
    </form>

    <form id="bcastMsgBulkForm" method="post">
    <div class="bg-white rounded-lg shadow-sm border border-slate-100 overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50 text-xs text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-3 py-2 text-left" style="width:36px;"><input type="checkbox" id="bcastMsgCheckAll" title="全選択"/></th>
                <th class="px-3 py-2 text-left" style="width:60px;">No</th>
                <th class="px-3 py-2 text-left" style="width:90px;">種別</th>
                <th class="px-3 py-2 text-left" th:text="${channel == 'SMS'} ? '番号' : 'メールアドレス'">メールアドレス</th>
                <th class="px-3 py-2 text-left">FROM</th>
                <th class="px-3 py-2 text-left">表示名</th>
                <th class="px-3 py-2 text-left">広告コード</th>
                <th class="px-3 py-2 text-left">フォルダ</th>
                <th class="px-3 py-2 text-left" th:unless="${channel == 'SMS'}">件名</th>
                <th class="px-3 py-2 text-left col-body">本文</th>
                <th class="px-3 py-2 text-left" style="width:110px;">ステータス</th>
                <th class="px-3 py-2 text-left" style="width:130px;">予約日時</th>
                <th class="px-3 py-2 text-left" style="width:130px;" th:text="${channel == 'SMS'} ? '送信日時' : '送信/受信日時'">送信/受信日時</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:if="${messages.totalElements == 0}">
                <td colspan="13" class="px-3 py-6 text-center text-slate-400">
                    <span th:if="${addr != null and addr != ''}">該当する送信履歴はありません</span>
                    <span th:unless="${addr != null and addr != ''}">一斉送信履歴はまだありません</span>
                </td>
            </tr>
            <tr th:each="m,it : ${messages.content}" class="hover:bg-slate-50">
                <td class="px-3 py-2"><input type="checkbox" class="bcast-msg-row-item" name="ids" th:value="${m.id}"/></td>
                <td class="px-3 py-2"><code class="text-xs text-slate-600" th:text="${messages.number * messages.size + it.count}"></code></td>
                <td class="px-3 py-2">
                    <span th:if="${m.direction == 'OUT' and m.channel == 'SMS'}"
                          class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-yellow-100 text-yellow-800"
                          title="SMS配信">SMS配信</span>
                    <span th:if="${m.direction == 'OUT' and m.channel != 'SMS'}"
                          class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-blue-100 text-blue-700"
                          title="管理者送信">一斉送信</span>
                    <span th:if="${m.direction == 'IN' and m.channel == 'WEB_REPLY'}"
                          class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-700"
                          title="返信URLからのフォーム返信">Web返信</span>
                    <span th:if="${m.direction == 'IN' and m.channel == 'EMAIL'}"
                          class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-slate-200 text-slate-600"
                          title="ユーザーからの直接メール返信">メール返信</span>
                </td>
                <td class="px-3 py-2 text-xs">
                    <a th:if="${channel == 'SMS'}" class="text-blue-600 hover:underline whitespace-nowrap"
                       th:href="@{'/manager/users/' + ${m.userId}}" target="_blank"
                       th:text="${m.toAddress} ?: '-'">-</a>
                    <a th:unless="${channel == 'SMS'}" class="text-blue-600 hover:underline whitespace-nowrap"
                       th:href="@{'/manager/users/' + ${m.userId}}" target="_blank"
                       th:text="${userEmails != null and userEmails.get(m.userId) != null} ? ${userEmails.get(m.userId)} : '-'">-</a>
                </td>
                <td class="px-3 py-2 text-xs text-slate-700 whitespace-nowrap"
                    th:text="${displayFrom != null and displayFrom.get(m.id) != null} ? ${displayFrom.get(m.id)} : ${m.fromAddress}"></td>
                <td class="px-3 py-2 text-xs text-slate-700 whitespace-nowrap"
                    th:text="${userDisplayNames != null and userDisplayNames.get(m.userId) != null and userDisplayNames.get(m.userId) != ''} ? ${userDisplayNames.get(m.userId)} : '-'"></td>
                <td class="px-3 py-2 text-xs text-slate-500"
                    th:text="${userAdCodes != null and userAdCodes.get(m.userId) != null} ? ${userAdCodes.get(m.userId)} : '-'"></td>
                <td class="px-3 py-2 text-xs text-slate-500"
                    th:text="${userFolders != null and userFolders.get(m.userId) != null} ? ${userFolders.get(m.userId)} : '-'"></td>
                <td class="px-3 py-2 text-xs text-slate-700 truncate" style="max-width:200px;" th:unless="${channel == 'SMS'}" th:text="${m.subject} ?: '(件名なし)'"></td>
                <td class="px-3 py-2 col-body">
                    <div class="body-text" th:text="${m.bodyText}"></div>
                </td>
                <td class="px-3 py-2">
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                          th:classappend="${m.status == 'SENT' or m.status == 'DELIVERED'} ? 'bg-emerald-100 text-emerald-700'
                                           : (${m.status == 'QUEUED'} ? 'bg-sky-100 text-sky-700'
                                           : (${m.status == 'FAILED'} ? 'bg-red-100 text-red-700'
                                           : (${m.status == 'CANCELLED'} ? 'bg-slate-200 text-slate-600' : 'bg-slate-100 text-slate-600')))"
                          th:text="${m.status}"></span>
                </td>
                <td class="px-3 py-2 text-xs text-slate-500 whitespace-nowrap">
                    <span th:if="${m.scheduledAt != null}" th:text="${#temporals.format(m.scheduledAt, 'yyyy-MM-dd HH:mm')}"></span>
                    <span th:unless="${m.scheduledAt != null}" class="text-slate-300">-</span>
                </td>
                <td class="px-3 py-2 text-xs text-slate-500 whitespace-nowrap">
                    <span th:if="${m.sentAt != null}" th:text="${#temporals.format(m.sentAt, 'yyyy-MM-dd HH:mm')}"></span>
                    <span th:unless="${m.sentAt != null}" th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="list-page-footer">
        <span class="selected-count" id="bcastMsgSelectedCount"></span>
        <button type="submit" class="btn-bulk-delete" id="btnBcastMsgDelete" disabled
                formaction="/manager/messages/broadcast/messages-bulk-delete"
                onclick="return confirmBulkDeleteBcastMsg();">選択削除</button>
    </div>
    </form>

    <nav class="mt-4" th:if="${messages.totalPages > 1}">
        <ul class="flex items-center gap-1 text-sm">
            <li>
                <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                   th:classappend="${messages.first} ? 'opacity-50 pointer-events-none'"
                   th:href="@{/manager/messages/broadcast(page=${messages.number - 1},addr=${addr},channel=${channel})}">前へ</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, messages.totalPages - 1)}"
                th:if="${i &lt; 10 or (i &gt;= messages.number - 2 and i &lt;= messages.number + 2) or i &gt;= messages.totalPages - 3}">
                <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                   th:classappend="${i == messages.number} ? 'bg-blue-600 text-white border-blue-600'"
                   th:href="@{/manager/messages/broadcast(page=${i},addr=${addr},channel=${channel})}" th:text="${i + 1}"></a>
            </li>
            <li>
                <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                   th:classappend="${messages.last} ? 'opacity-50 pointer-events-none'"
                   th:href="@{/manager/messages/broadcast(page=${messages.number + 1},addr=${addr},channel=${channel})}">次へ</a>
            </li>
        </ul>
    </nav>
    <p class="mt-3 text-xs text-slate-500">
        全 <span th:text="${messages.totalElements}">0</span> 件 (100件ずつ表示)
    </p>

<script>
(function () {
    var checkAll = document.getElementById('bcastMsgCheckAll');
    var btnDelete = document.getElementById('btnBcastMsgDelete');
    var countLabel = document.getElementById('bcastMsgSelectedCount');
    function rows() { return document.querySelectorAll('.bcast-msg-row-item'); }
    function refresh() {
        var checked = [].filter.call(rows(), function (c) { return c.checked; });
        var has = checked.length > 0;
        countLabel.textContent = has ? (checked.length + ' 件選択中') : '';
        btnDelete.disabled = !has;
        if (checkAll) {
            checkAll.indeterminate = has && checked.length < rows().length;
            checkAll.checked = rows().length > 0 && checked.length === rows().length;
        }
    }
    if (checkAll) checkAll.addEventListener('change', function () {
        [].forEach.call(rows(), function (c) { c.checked = checkAll.checked; });
        refresh();
    });
    document.addEventListener('change', function (e) {
        if (e.target.classList && e.target.classList.contains('bcast-msg-row-item')) refresh();
    });
    window.confirmBulkDeleteBcastMsg = function () {
        var n = [].filter.call(rows(), function (c) { return c.checked; }).length;
        if (n === 0) return false;
        if (!confirm('選択した ' + n + ' 件のメッセージを削除します。よろしいですか?')) return false;
        if (!confirm('本当に削除してよろしいですか? この操作は取り消せません。')) return false;
        var pw = prompt('管理者パスワードを入力してください');
        if (!pw) return false;
        var f = document.getElementById('bcastMsgBulkForm');
        var h = f.querySelector('input[name="confirmPassword"]');
        if (!h) { h = document.createElement('input'); h.type='hidden'; h.name='confirmPassword'; f.appendChild(h); }
        h.value = pw;
        return true;
    };
})();
</script>
</section>
</body>
</html>
