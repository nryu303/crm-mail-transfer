<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  メッセージボックス shared fragment — rendered identically (same HTML/CSS) by:
    - the public /reply/{token} page (isAdmin=false): read-only history + per-item reply,
      no delete affordance at all.
    - the admin /manager/users/{id}/message-box preview (isAdmin=true): same list, plus a
      選択削除 checkbox/button (soft-delete, admin-only) and per-item reply forms that post
      through the existing admin compose endpoints so a real reply is sent to the user.

  Split into two tabs 2026-09-09 (受信履歴 default / 送信履歴): previously this fragment only
  ever showed direction=OUT history (what the CRM sent), so a user with no prior OUT message
  had no visible way to send anything at all — the per-item reply forms below only render
  inside the OUT-history loop. 受信履歴 now also carries a standalone compose box that isn't
  tied to replying to a specific historical item.

  Params:
    box         — org.springframework.data.domain.Page<com.crm.dto.MessageBoxItem>, 送信履歴 (OUT)
    inboundBox  — org.springframework.data.domain.Page<com.crm.dto.MessageBoxItem>, 受信履歴 (IN)
    token       — reply-page token (public context only; null when isAdmin)
    isAdmin     — boolean, gates the delete UI and switches the reply-form target
    userId      — user id (admin context only; used to build the reply POST / pager URLs)
    userPhoneNumber — admin context only; gates the standalone compose box's SMS-send button
-->
<div th:fragment="messageBox(box, inboundBox, token, isAdmin, userId, userPhoneNumber)" class="message-box-shell">
    <div class="message-box-head">
        <h2 class="message-box-title">メッセージボックス</h2>
    </div>

    <div class="message-box-tabs">
        <button type="button" class="message-box-tab active" data-mbtab="inbound">受信履歴</button>
        <button type="button" class="message-box-tab" data-mbtab="outbound">送信履歴</button>
    </div>

    <form th:if="${isAdmin}" id="messageBoxDeleteForm" method="post"
          th:action="@{'/manager/users/' + ${userId} + '/message-box/delete'}"></form>
    <form th:if="${isAdmin}" id="messageBoxDeleteAllForm" method="post"
          th:action="@{'/manager/users/' + ${userId} + '/message-box/delete-all'}"></form>
    <form th:if="${isAdmin}" id="messageBoxDeleteAllInboundForm" method="post"
          th:action="@{'/manager/users/' + ${userId} + '/message-box/delete-all-inbound'}"></form>

    <!-- ===== 受信履歴 (default tab) ===== -->
    <div class="message-box-pane" data-mbpane="inbound">
        <!-- Standalone compose — not tied to any specific past message, so it's always
             available even when this user has never sent anything in before. -->
        <div class="message-box-compose">
            <form th:if="${!isAdmin}" class="reply-form message-box-reply-form"
                  th:action="@{'/reply/' + ${token} + '/send'}" method="post">
                <div class="field">
                    <textarea name="body" rows="4" placeholder="メッセージを送信..."></textarea>
                </div>
                <div class="actions">
                    <button type="submit">送信</button>
                </div>
            </form>
            <form th:if="${isAdmin}" class="reply-form message-box-reply-form"
                  th:action="@{'/manager/users/' + ${userId} + '/messages'}" method="post">
                <input type="hidden" name="returnTo" value="message-box"/>
                <div class="field">
                    <input type="text" name="subject" placeholder="件名（メールのみ）" style="margin-bottom:4px;"/>
                    <textarea name="body" rows="4" placeholder="メッセージを送信..."></textarea>
                </div>
                <div class="actions">
                    <button type="submit" th:if="${userPhoneNumber != null and !userPhoneNumber.isEmpty()}"
                            th:formaction="@{'/manager/users/' + ${userId} + '/messages/sms'}"
                            style="background:#ca8a04;">SMS送信</button>
                    <button type="submit">メール送信</button>
                </div>
            </form>
        </div>

        <span th:if="${isAdmin}" class="message-box-head-actions" style="margin:8px 0;">
            <button type="submit" form="messageBoxDeleteForm"
                    class="message-box-delete-btn"
                    onclick="return confirm('選択したメッセージを削除しますか？');">選択削除</button>
            <button type="submit" form="messageBoxDeleteAllInboundForm"
                    class="message-box-delete-btn message-box-delete-all-btn"
                    onclick="return confirm('この受信履歴を全件削除します。よろしいですか？');">全件削除</button>
        </span>

        <div th:if="${inboundBox == null or inboundBox.content.empty}" class="message-box-empty">受信履歴はありません</div>

        <div th:each="item : ${inboundBox != null ? inboundBox.content : {}}" class="message-box-item">
            <div class="message-box-item-head">
                <input th:if="${isAdmin}" type="checkbox" name="ids" th:value="${item.id}"
                       form="messageBoxDeleteForm" class="message-box-checkbox"/>
                <span class="message-box-date"
                      th:text="'受信時間 : ' + ${#temporals.format(item.sentAt, 'yyyy/MM/dd HH:mm')}"></span>
            </div>
            <div class="message-box-reply-label" th:text="${item.replyLabel}"></div>
            <div class="message-box-subject" th:if="${item.subject != null and !item.subject.isEmpty()}"
                 th:text="${item.subject}"></div>
            <div class="message-box-body" th:text="${item.bodyText}"></div>
        </div>

        <div class="message-box-pager" th:if="${inboundBox != null and inboundBox.totalPages > 1}">
            <span th:each="p : ${#numbers.sequence(0, inboundBox.totalPages - 1)}">
                <a th:if="${p != inboundBox.number and isAdmin}"
                   th:href="@{'/manager/users/' + ${userId} + '/message-box'(inboundPage=${p})}"
                   th:text="${p + 1}"></a>
                <a th:if="${p != inboundBox.number and !isAdmin}"
                   th:href="@{'/reply/' + ${token}(inbound_page=${p})}"
                   th:text="${p + 1}"></a>
                <strong th:if="${p == inboundBox.number}" th:text="${p + 1}"></strong>
            </span>
        </div>
    </div>

    <!-- ===== 送信履歴 ===== -->
    <div class="message-box-pane" data-mbpane="outbound" style="display:none;">
        <span th:if="${isAdmin}" class="message-box-head-actions" style="margin:8px 0;">
            <button type="submit" form="messageBoxDeleteForm"
                    class="message-box-delete-btn"
                    onclick="return confirm('選択したメッセージを削除しますか？');">選択削除</button>
            <button type="submit" form="messageBoxDeleteAllForm"
                    class="message-box-delete-btn message-box-delete-all-btn"
                    onclick="return confirm('この送信履歴を全件削除します。よろしいですか？');">全件削除</button>
        </span>

        <div th:if="${box.content.empty}" class="message-box-empty">送信履歴はありません</div>

        <div th:each="item : ${box.content}" class="message-box-item">
            <div class="message-box-item-head">
                <input th:if="${isAdmin}" type="checkbox" name="ids" th:value="${item.id}"
                       form="messageBoxDeleteForm" class="message-box-checkbox"/>
                <span class="message-box-date"
                      th:text="'受信時間 : ' + ${#temporals.format(item.sentAt, 'yyyy/MM/dd HH:mm')}"></span>
            </div>

            <!-- Re: 件名 — de-emphasized, fixed display. Never deletable from the user side; only
                 the checkbox above (admin-only) can remove the whole item. -->
            <div class="message-box-reply-label" th:text="${item.replyLabel}"></div>

            <div class="message-box-subject" th:if="${item.subject != null and !item.subject.isEmpty()}"
                 th:text="${item.subject}"></div>
            <div class="message-box-body" th:text="${item.bodyText}"></div>

            <div class="message-box-divider"></div>

            <!-- Public reply form: posts to /reply/{token}/send with replyToMessageId targeting
                 this specific historical message. The subject hidden field mirrors item.replyLabel
                 (e.g. "Re: 井上聡") so the resulting IN message carries a real subject instead of
                 showing up blank ((件名なし)) in the admin CRM inbox. -->
            <form th:if="${!isAdmin}" class="reply-form message-box-reply-form"
                  th:action="@{'/reply/' + ${token} + '/send'}" method="post">
                <input type="hidden" name="replyToMessageId" th:value="${item.id}"/>
                <input type="hidden" name="subject" th:value="${item.replyLabel}"/>
                <div class="field">
                    <textarea name="body" rows="4" placeholder="返信を入力..."></textarea>
                </div>
                <div class="actions">
                    <button type="submit">返信</button>
                </div>
            </form>

            <!-- Admin reply form: posts through the existing per-user compose endpoints
                 (EMAIL/BROADCAST channel → /messages, SMS channel → /messages/sms) so it reuses
                 the same send pipeline, error handling, and audit trail as the thread page. -->
            <form th:if="${isAdmin and item.channel == 'SMS'}" class="reply-form message-box-reply-form"
                  th:action="@{'/manager/users/' + ${userId} + '/messages/sms'}" method="post">
                <input type="hidden" name="returnTo" value="message-box"/>
                <input type="hidden" name="replyToMessageId" th:value="${item.id}"/>
                <div class="field">
                    <textarea name="body" rows="4" placeholder="返信を入力..."></textarea>
                </div>
                <div class="actions">
                    <button type="submit">返信</button>
                </div>
            </form>
            <form th:if="${isAdmin and item.channel != 'SMS'}" class="reply-form message-box-reply-form"
                  th:action="@{'/manager/users/' + ${userId} + '/messages'}" method="post">
                <input type="hidden" name="returnTo" value="message-box"/>
                <input type="hidden" name="replyToMessageId" th:value="${item.id}"/>
                <input type="hidden" name="subject"
                       th:value="${item.subject != null and !item.subject.isEmpty() ? ('Re: ' + item.subject) : 'Re:'}"/>
                <div class="field">
                    <textarea name="body" rows="4" placeholder="返信を入力..."></textarea>
                </div>
                <div class="actions">
                    <button type="submit">返信</button>
                </div>
            </form>
        </div>

        <div class="message-box-pager" th:if="${box.totalPages > 1}">
            <span th:each="p : ${#numbers.sequence(0, box.totalPages - 1)}">
                <a th:if="${p != box.number and isAdmin}"
                   th:href="@{'/manager/users/' + ${userId} + '/message-box'(page=${p})}"
                   th:text="${p + 1}"></a>
                <a th:if="${p != box.number and !isAdmin}"
                   th:href="@{'/reply/' + ${token}(box_page=${p})}"
                   th:text="${p + 1}"></a>
                <strong th:if="${p == box.number}" th:text="${p + 1}"></strong>
            </span>
        </div>
    </div>

    <script th:inline="javascript">
        (function () {
            var tabs = document.querySelectorAll('.message-box-tab');
            var panes = document.querySelectorAll('.message-box-pane');
            tabs.forEach(function (tab) {
                tab.addEventListener('click', function () {
                    var target = tab.getAttribute('data-mbtab');
                    tabs.forEach(function (t) { t.classList.toggle('active', t === tab); });
                    panes.forEach(function (p) {
                        p.style.display = (p.getAttribute('data-mbpane') === target) ? '' : 'none';
                    });
                });
            });
        })();
    </script>
</div>
</body>
</html>
