<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>ホームHTML編集</title>
    <style>
        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .field-row > .editor-side > textarea { width: 100%; }
        .preview-pane {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            overflow: hidden;
            display: flex; flex-direction: column;
            min-height: 600px;
        }
        .preview-pane .preview-label {
            background: #f1f5f9; color: #475569; font-size: .68rem; font-weight: 600;
            padding: 4px 8px; border-bottom: 1px solid #cbd5e1; letter-spacing: .05em;
        }
        .preview-pane iframe { flex: 1; border: 0; width: 100%; background: #fff; min-height: 600px; }
        @media (max-width: 1100px) {
            .field-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">
            <span th:if="${isNew}">ホームHTML 新規追加</span>
            <span th:unless="${isNew}">ホームHTML 編集</span>
        </h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
           th:href="@{/manager/settings/home-html}">一覧に戻る</a>
    </div>

    <div class="max-w-5xl rounded-md border border-sky-200 bg-sky-50 px-4 py-3 text-sm text-sky-800 mb-4">
        ここに入力したHTMLが、本ドメイン (<code>https://avu74g.jp/</code>) のトップでそのまま配信されます。
        右側のプレビューは入力中に自動更新されます (返信画面設定と同じ仕組みです)。
    </div>

    <form th:method="post"
          th:action="${isNew} ? @{/manager/settings/home-html} : @{'/manager/settings/home-html/' + ${variant.id}}"
          class="bg-white rounded-lg shadow-sm border border-slate-100 p-6">

        <div class="mb-4">
            <label class="block text-sm font-semibold text-slate-800 mb-1">名前</label>
            <input type="text" name="name" th:value="${variant.name}" required
                   class="tw-input" placeholder="例: ランディングA / メンテナンス告知 など"/>
            <p class="text-xs text-slate-500 mt-1">管理画面で見分けるためのラベルです（外部には公開されません）。</p>
        </div>

        <div class="field-row">
            <div class="editor-side">
                <label class="block text-sm font-semibold text-slate-800 mb-1">HTML本体</label>
                <p class="text-xs text-slate-500 mb-2">
                    完全なHTMLドキュメント（<code>&lt;!DOCTYPE html&gt;</code> から）でも、断片だけでも構いません。
                </p>
                <textarea id="htmlEditor" name="htmlContent" rows="24"
                          class="tw-input font-mono"
                          style="white-space:pre; font-size:0.78rem; line-height:1.45; min-height:600px;"
                          th:text="${variant.htmlContent}"
                          placeholder="&lt;!DOCTYPE html&gt;&#10;&lt;html lang=&quot;ja&quot;&gt;..."></textarea>
            </div>
            <div class="preview-pane">
                <div class="preview-label">▶ プレビュー (sandboxed iframe — 保存しなくても即時反映)</div>
                <!-- sandbox flags match the production root iframe / reply preview so external
                     fonts, scripts and embeds behave identically here as when the HTML is live. -->
                <iframe id="htmlPreview"
                        sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
            </div>
        </div>

        <div th:if="${isNew}" class="mb-4 flex items-center">
            <input type="checkbox" id="activateNow" name="activateNow"
                   class="h-4 w-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500"/>
            <label for="activateNow" class="ml-2 text-sm text-slate-700">
                保存後にこのHTMLを「現在表示」にする
            </label>
        </div>

        <div class="flex items-center gap-3 mt-4">
            <button type="submit"
                    class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow-sm">
                保存する
            </button>
            <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
               th:href="@{/manager/settings/home-html}">キャンセル</a>
        </div>
    </form>

    <script>
    // Live preview — write the editor content into the iframe each keystroke. We use
    // srcdoc rather than document.write so the iframe is fully reset on each update
    // (avoids leftover script state from a previous edit).
    (function () {
        var ed = document.getElementById('htmlEditor');
        var pv = document.getElementById('htmlPreview');
        if (!ed || !pv) return;
        function render() {
            pv.srcdoc = ed.value || '<em style="color:#94a3b8;font-family:sans-serif;padding:16px;display:block;">プレビューは入力後に表示されます</em>';
        }
        ed.addEventListener('input', render);
        render();
    })();
    </script>
</section>
</body>
</html>
