<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>フォルダ設定</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">フォルダ設定</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md" th:href="@{/manager/settings}">設定トップへ</a>
    </div>

    <form method="post" th:action="@{/manager/settings/folders}"
          class="bg-white rounded-lg shadow-sm border border-slate-100 p-6 max-w-2xl">
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">
                フォルダ名 <span class="text-xs text-slate-500 font-normal">（1行に1つ / カンマ区切り可）</span>
            </label>
            <textarea name="folderText" rows="8" class="tw-input"
                      placeholder="フォルダA&#10;フォルダB&#10;フォルダC" th:text="${folderText}"></textarea>
            <p class="mt-1 text-xs text-slate-500">
                現在 <strong th:text="${folderCount}">0</strong> 個のフォルダが登録されています。<br/>
                ここで名前を追加・削除することでフォルダ個数を変更できます。一覧で未設定（フォルダなし）のユーザーはフィルタで別途絞り込めます。
            </p>
        </div>
        <div class="flex items-center gap-3">
            <button type="submit" class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md">保存</button>
            <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md" th:href="@{/manager/settings}">キャンセル</a>
        </div>
    </form>
</section>
</body>
</html>
