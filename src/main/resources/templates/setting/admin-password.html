<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>管理者パスワード変更</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">管理者パスワード変更</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md" th:href="@{/manager/settings}">設定に戻る</a>
    </div>

    <p class="text-sm text-slate-500 mb-4">
        この管理画面にログインする際のパスワードを変更します。変更後は自動的にログアウトされ、新しいパスワードで再度ログインしていただきます。
    </p>

    <div th:if="${errorMessage}" class="rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-800 mb-4" style="max-width: 560px;" th:text="${errorMessage}"></div>

    <form method="post" th:action="@{/manager/settings/admin-password}"
          class="bg-white rounded-lg shadow-sm border border-slate-100 p-6" style="max-width: 560px;" autocomplete="off">

        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">現在のパスワード <span class="text-red-500">*</span></label>
            <input type="password" class="tw-input" name="oldPassword" required autocomplete="current-password"/>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">新しいパスワード <span class="text-red-500">*</span></label>
            <input type="password" class="tw-input" name="newPassword" required minlength="8" autocomplete="new-password"/>
            <p class="mt-1 text-xs text-slate-500">8文字以上で設定してください。</p>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">新しいパスワード (確認) <span class="text-red-500">*</span></label>
            <input type="password" class="tw-input" name="confirmPassword" required minlength="8" autocomplete="new-password"/>
        </div>

        <div class="flex items-center gap-3">
            <button type="submit" class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow-sm">変更する</button>
            <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md" th:href="@{/manager/settings}">キャンセル</a>
        </div>
    </form>
</section>
</body>
</html>
