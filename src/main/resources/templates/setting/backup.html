<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>バックアップ設定</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">バックアップ設定</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md" th:href="@{/manager/settings}">設定に戻る</a>
    </div>

    <div class="bg-amber-50 border border-amber-300 rounded-lg p-4 mb-4 text-sm text-amber-900 max-w-2xl">
        <strong>⚠ 容量にご注意ください。</strong>
        バックアップはDBの全内容をこのサーバーのディスクに保存します。頻度・保持件数を増やすほど使用容量が増え、
        サーバーの空き容量を圧迫する可能性があります。ダッシュボードのディスク使用率と合わせてご確認のうえ設定してください。
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-slate-100 p-6 max-w-2xl">
        <form method="post" th:action="@{/manager/settings/backup}" class="space-y-4">
            <input type="hidden" name="_csrf" th:value="${_csrf}"/>
            <label class="flex items-center gap-2">
                <input type="checkbox" name="enabled" value="true" th:checked="${config.enabled}"/>
                <span class="text-sm font-medium text-slate-700">自動バックアップを有効化</span>
            </label>
            <div class="flex items-center gap-2">
                <label class="text-sm text-slate-600 w-32">実行間隔</label>
                <input type="number" name="intervalHours" min="1" max="720" th:value="${config.intervalHours}"
                       class="tw-input" style="width:100px;"/>
                <span class="text-xs text-slate-500">時間ごと（24 = 毎日）</span>
            </div>
            <div class="flex items-center gap-2">
                <label class="text-sm text-slate-600 w-32">保持件数</label>
                <input type="number" name="retentionCount" min="1" max="365" th:value="${config.retentionCount}"
                       class="tw-input" style="width:100px;"/>
                <span class="text-xs text-slate-500">件（超えた分の古いバックアップは自動削除）</span>
            </div>
            <div class="text-xs text-slate-500" th:if="${config.lastRunAt != null}">
                前回実行: <span th:text="${#temporals.format(config.lastRunAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
            <div class="text-xs text-slate-400" th:if="${config.lastRunAt == null}">
                まだ実行されていません
            </div>
            <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-md text-sm">保存</button>
        </form>

        <form method="post" th:action="@{/manager/settings/backup/run-now}" class="mt-4 pt-4 border-t border-slate-100"
              onsubmit="return confirm('今すぐバックアップを実行します。よろしいですか?');">
            <input type="hidden" name="_csrf" th:value="${_csrf}"/>
            <button type="submit" class="px-4 py-2 bg-slate-700 hover:bg-slate-800 text-white text-sm font-bold rounded-md">今すぐバックアップ</button>
        </form>
    </div>
</section>
</body>
</html>
