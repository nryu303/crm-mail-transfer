<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>専用返信画面HTML 一括編集</title>
    <style>
        .slot-tab {
            padding: 8px 12px;
            border-right: 1px solid #e2e8f0;
            background: #f8fafc;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex: 1 1 0;
            font-size: 0.78rem;
            border-bottom: 2px solid transparent;
        }
        .slot-tab.active {
            background: #fff;
            color: #1d4ed8;
            font-weight: 600;
            border-bottom: 2px solid #3b82f6;
        }
        .slot-tab input[type="radio"] { cursor: pointer; }
        .slot-tab .title-inline {
            border: 1px solid transparent;
            background: transparent;
            padding: 2px 4px;
            font-size: 0.78rem;
            min-width: 60px;
            max-width: 100%;
            outline: none;
        }
        .slot-tab .title-inline:hover, .slot-tab .title-inline:focus {
            border: 1px solid #cbd5e1;
            background: #fff;
        }
        .slot-pane {
            min-height: 280px;
            max-height: 60vh;
            resize: vertical;
            font-family: monospace;
            white-space: pre;
            font-size: 0.78rem;
            line-height: 1.4;
            padding: 8px 10px;
            border: 0;
            border-top: 1px solid #e2e8f0;
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">専用返信画面HTML 一括編集</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md mr-2" th:href="@{/manager/settings/reply-page}">返信画面設定に戻る</a>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md" th:href="@{/manager/settings}">設定TOP</a>
    </div>

    <p class="text-sm text-slate-500 mb-4">
        フォルダ単位で <strong th:text="${slotCount}">6</strong> スロット分の専用返信HTMLと「使用中」スロットを一括登録します。
        各スロットのタブ名はクリックで編集できます。空白で保存するとそのスロットの内容は削除されます。
    </p>

    <!-- Folder picker + bulk-apply form -->
    <form method="post" th:action="@{/manager/settings/memo-html-bulk}" class="bg-white rounded-lg shadow-sm border border-slate-100 p-4 mb-4">
        <input type="hidden" name="_csrf" th:value="${_csrf}"/>
        <div class="flex flex-wrap items-end gap-3 mb-3">
            <div>
                <label class="block text-xs text-slate-500 mb-1">対象フォルダ</label>
                <select name="folder" class="tw-input" style="min-width:240px;">
                    <option value="" th:selected="${selectedFolder == ''}">（未設定）</option>
                    <option th:each="f : ${folders}" th:value="${f}" th:text="${f}"
                            th:selected="${selectedFolder == f}"></option>
                </select>
            </div>
            <div class="text-xs text-slate-500" style="max-width:480px;">
                選択したフォルダ内の全ユーザーに、下記6スロットの内容と使用中ラジオを上書きします。<br/>
                空欄スロットは該当ユーザーのスロットを<strong>クリア</strong>します。
            </div>
        </div>

        <!-- Slot tabs (display name inline-edit + 使用中 radio) -->
        <div class="border border-slate-200 rounded-md overflow-hidden">
            <div id="slotTabs" class="flex border-b border-slate-200 bg-slate-50 overflow-x-auto">
                <div th:each="i : ${#numbers.sequence(1, slotCount)}"
                     class="slot-tab"
                     th:classappend="${activeSlot == i ? 'active' : ''}"
                     th:attr="data-slot=${i}">
                    <input type="radio" name="activeSlot" th:value="${i}"
                           th:checked="${activeSlot == i}"
                           title="このスロットを使用中にする"/>
                    <span class="text-slate-400" th:text="${i}">1</span>
                    <!-- Inline editable title — saved via the "スロット名を保存" form below -->
                    <span class="title-inline-wrap" th:text="${slotTitles[i - 1]}">タイトル</span>
                </div>
            </div>
            <textarea th:each="i : ${#numbers.sequence(1, slotCount)}"
                      class="slot-pane"
                      th:id="'html' + ${i}"
                      th:name="'html' + ${i}"
                      th:text="${htmls[i - 1]}"
                      th:style="${activeSlot == i ? '' : 'display:none;'}"
                      th:placeholder="${slotTitles[i - 1]} + ' の HTML を入力（空白で削除）'"></textarea>
        </div>

        <div class="flex items-center gap-2 pt-4 border-t border-slate-100 mt-3 flex-wrap">
            <button type="submit"
                    class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md"
                    onclick="return confirm('対象フォルダ内の全ユーザーに6スロット分のHTMLと使用中設定を上書きします。よろしいですか?');">
                フォルダ内ユーザーへ一括適用
            </button>
            <span class="text-xs text-slate-500">プレビュー →</span>
            <a class="inline-flex items-center px-2 py-1.5 text-xs border border-slate-300 text-slate-600 hover:bg-slate-50 rounded-md"
               th:href="@{/manager/settings/reply-page}" target="_blank">使用中 (site default)</a>
            <span class="text-xs text-slate-400 ml-2">※ 個別ユーザーのプレビューはユーザー詳細ページから</span>
        </div>
    </form>

    <!-- Slot titles edit form (separate POST so saving titles doesn't apply HTML) -->
    <details class="bg-white rounded-lg shadow-sm border border-slate-100 p-4">
        <summary class="cursor-pointer text-sm text-slate-700 hover:text-slate-900">各スロットの表示名を編集</summary>
        <form method="post" th:action="@{/manager/settings/memo-html-bulk/titles}" class="mt-3 grid grid-cols-1 md:grid-cols-3 gap-2">
            <input type="hidden" name="_csrf" th:value="${_csrf}"/>
            <div th:each="i : ${#numbers.sequence(1, slotCount)}" class="flex flex-col">
                <label class="text-xs text-slate-500 mb-0.5" th:text="'スロット ' + ${i}"></label>
                <input type="text" class="tw-input" th:name="'title' + ${i}" th:value="${slotTitles[i - 1]}" maxlength="30"/>
            </div>
            <button type="submit" class="md:col-span-3 mt-2 inline-flex items-center justify-center px-3 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-700 text-white rounded w-fit">スロット名を保存</button>
        </form>
    </details>

    <script>
    // Slot tab behaviour: click switches the visible textarea + marks the radio active.
    // The radio itself also triggers a switch when changed.
    (function () {
        var tabs = document.querySelectorAll('#slotTabs .slot-tab');
        function show(slot) {
            tabs.forEach(function (t) {
                t.classList.toggle('active', String(t.getAttribute('data-slot')) === String(slot));
            });
            for (var i = 1; i <= tabs.length; i++) {
                var ta = document.getElementById('html' + i);
                if (ta) ta.style.display = (String(i) === String(slot)) ? '' : 'none';
            }
        }
        tabs.forEach(function (t) {
            t.addEventListener('click', function (e) {
                // If they clicked the radio itself, leave the radio handler alone.
                if (e.target && e.target.tagName === 'INPUT') {
                    show(t.getAttribute('data-slot'));
                    return;
                }
                show(t.getAttribute('data-slot'));
            });
            var radio = t.querySelector('input[type="radio"]');
            if (radio) radio.addEventListener('change', function () {
                if (radio.checked) show(t.getAttribute('data-slot'));
            });
        });
    })();
    </script>
</section>
</body>
</html>
