<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>定型文</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">定型文</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md mr-2" th:href="@{/manager/settings}">設定に戻る</a>
        <a class="inline-flex items-center px-3 py-1.5 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-md shadow-sm"
           th:href="@{/manager/settings/message-templates/new(page=${pageNo})}"
           th:classappend="${canCreate ? '' : 'opacity-50 pointer-events-none'}">新規追加</a>
    </div>

    <!-- Page tab strip — 5 pages, each with operator-supplied title. Click switches the visible page. -->
    <div class="bg-white rounded-lg shadow-sm border border-slate-100 mb-4">
        <div class="flex border-b border-slate-100 overflow-x-auto">
            <a th:each="i : ${#numbers.sequence(1, maxPages)}"
               th:href="@{/manager/settings/message-templates(page=${i},q=${q})}"
               class="px-4 py-2.5 text-sm whitespace-nowrap border-r border-slate-100"
               th:classappend="${pageNo == i ? 'bg-blue-50 text-blue-700 font-semibold border-b-2 border-b-blue-500' : 'text-slate-600 hover:bg-slate-50'}">
                <span class="text-xs text-slate-400 mr-1" th:text="${i}">1</span>
                <span th:text="${pageTitles[i - 1]}">タイトル</span>
                <span class="ml-2 text-xs text-slate-400" th:text="'(' + ${perPageCounts[i]} + '/' + ${maxTemplates} + ')'">(0/50)</span>
            </a>
        </div>
        <details class="px-4 py-2 text-xs text-slate-500 border-t border-slate-100">
            <summary class="cursor-pointer text-slate-600 hover:text-slate-800">ページタイトルを編集</summary>
            <form method="post" th:action="@{/manager/settings/message-templates/page-titles}" class="mt-2 grid grid-cols-1 md:grid-cols-5 gap-2">
                <input type="hidden" name="_csrf" th:value="${_csrf}"/>
                <div th:each="i : ${#numbers.sequence(1, maxPages)}" class="flex flex-col">
                    <label class="text-xs text-slate-500 mb-0.5" th:text="'ページ ' + ${i}"></label>
                    <input type="text" class="tw-input" th:name="'title' + ${i}" th:value="${pageTitles[i - 1]}" maxlength="20"/>
                </div>
                <button type="submit" class="md:col-span-5 mt-1 inline-flex items-center justify-center px-3 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-700 text-white rounded w-fit">タイトルを保存</button>
            </form>
        </details>
    </div>

    <p class="text-sm text-slate-500 mb-4">
        現在 <strong th:text="${pageTitles[pageNo - 1]}">タイトル</strong>: <span th:text="${templates.size()}">0</span> 件表示 (最大<span th:text="${maxTemplates}">50</span>件/ページ)。
    </p>

    <form method="get" th:action="@{/manager/settings/message-templates}"
          class="bg-white rounded-lg shadow-sm border border-slate-100 p-4 mb-4 flex items-end gap-3">
        <input type="hidden" name="page" th:value="${pageNo}"/>
        <div style="max-width: 380px; flex: 1;">
            <label class="block text-xs text-slate-500 mb-1">検索（名前・件名・本文）</label>
            <input type="text" name="q" class="tw-input" th:value="${q}" placeholder="キーワード"/>
        </div>
        <button type="submit" class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded">検索</button>
        <a class="inline-flex items-center px-3 py-2 border border-slate-300 bg-white text-slate-600 text-sm rounded hover:bg-slate-50"
           th:href="@{/manager/settings/message-templates(page=${pageNo})}">クリア</a>
    </form>

    <form id="bulkForm" method="post" th:action="@{/manager/settings/message-templates/bulk-delete}"
          onsubmit="return confirmBulkDelete();">
        <input type="hidden" name="_csrf" th:value="${_csrf}"/>
        <div class="bg-white rounded-lg shadow-sm border border-slate-100 overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200 text-sm">
                <thead class="bg-slate-50 text-xs text-slate-500 uppercase tracking-wider">
                <tr>
                    <th class="px-3 py-2 text-center" style="width: 36px;" title="ドラッグして並び替え">⋮⋮</th>
                    <th class="px-3 py-2 text-center" style="width: 36px;">
                        <input type="checkbox" id="checkAll" title="全選択"/>
                    </th>
                    <th class="px-3 py-2 text-left" style="width: 60px;">ID</th>
                    <th class="px-3 py-2 text-left">名前</th>
                    <th class="px-3 py-2 text-left">件名</th>
                    <th class="px-3 py-2 text-left">本文</th>
                    <th class="px-3 py-2 text-right" style="width: 90px;">操作</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100" id="tplTbody">
                <tr th:if="${templates.empty}">
                    <td colspan="7" class="px-3 py-6 text-center text-slate-400">定型文はまだ登録されていません</td>
                </tr>
                <tr th:each="t,it : ${templates}" class="hover:bg-slate-50 tpl-row"
                    th:attr="data-id=${t.id}" draggable="true">
                    <td class="px-3 py-2 text-center text-slate-400 cursor-grab select-none drag-handle"
                        title="ドラッグして並び替え" style="font-family: monospace; font-size: 16px;">⋮⋮</td>
                    <td class="px-3 py-2 text-center">
                        <input type="checkbox" class="row-item" name="ids" th:value="${t.id}"/>
                    </td>
                    <td class="px-3 py-2"><code class="text-xs text-slate-600" th:text="${it.count}"></code></td>
                    <td class="px-3 py-2 text-slate-700">
                        <span th:if="${t.color != null and t.color != ''}"
                              class="inline-block w-3 h-3 rounded-full align-middle mr-1.5 border"
                              th:classappend="'border-' + ${t.color} + '-400 bg-' + ${t.color} + '-200'"
                              th:title="'枠色: ' + ${t.color}"></span>
                        <span th:text="${t.name}"></span>
                    </td>
                    <td class="px-3 py-2 text-xs text-slate-600 truncate" style="max-width: 260px;" th:text="${t.subject}"></td>
                    <td class="px-3 py-2 text-xs text-slate-500 truncate" style="max-width: 320px;" th:text="${t.body}"></td>
                    <td class="px-3 py-2 text-right">
                        <a class="inline-flex items-center px-3 py-1 text-xs bg-blue-50 border border-blue-200 text-blue-700 hover:bg-blue-100 rounded"
                           th:href="@{'/manager/settings/message-templates/' + ${t.id} + '/edit'}">編集</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div id="reorderStatus" class="px-3 py-2 text-xs text-slate-500 border-t border-slate-100 hidden">
                並び順を保存しています…
            </div>
            <div class="flex items-center justify-end gap-2 px-3 py-3 border-t border-slate-100 bg-slate-50">
                <span id="selectedCount" class="text-xs text-slate-500 mr-2"></span>
                <button type="submit" id="btnBulkDelete" disabled
                        class="inline-flex items-center px-4 py-2 text-sm bg-red-600 hover:bg-red-700 text-white font-medium rounded-md disabled:bg-slate-300 disabled:cursor-not-allowed">選択削除</button>
            </div>
        </div>
    </form>
    <script>
    (function () {
        var checkAll = document.getElementById('checkAll');
        var btn = document.getElementById('btnBulkDelete');
        var count = document.getElementById('selectedCount');
        function rows() { return document.querySelectorAll('.row-item'); }
        function refresh() {
            var ck = [].filter.call(rows(), function (c) { return c.checked; });
            btn.disabled = ck.length === 0;
            count.textContent = ck.length > 0 ? (ck.length + ' 件選択中') : '';
            if (checkAll) {
                checkAll.indeterminate = ck.length > 0 && ck.length < rows().length;
                checkAll.checked = rows().length > 0 && ck.length === rows().length;
            }
        }
        if (checkAll) checkAll.addEventListener('change', function () {
            [].forEach.call(rows(), function (c) { c.checked = checkAll.checked; });
            refresh();
        });
        document.addEventListener('change', function (e) {
            if (e.target.classList && e.target.classList.contains('row-item')) refresh();
        });
        refresh();
    })();
    window.confirmBulkDelete = function () {
        var n = document.querySelectorAll('.row-item:checked').length;
        if (n === 0) return false;
        return confirm(n + ' 件の定型文を削除します。よろしいですか?');
    };
    </script>

    <script>
    // Native HTML5 drag-and-drop reordering. No external library. Drop fires the POST to
    // /reorder which updates DISPLAY_ORDER on every row in the new sequence.
    (function () {
        var tbody = document.getElementById('tplTbody');
        if (!tbody) return;
        var status = document.getElementById('reorderStatus');
        var dragged = null;

        function rows() { return tbody.querySelectorAll('tr.tpl-row'); }

        rows().forEach(function (row) {
            row.addEventListener('dragstart', function (e) {
                dragged = row;
                row.classList.add('opacity-50');
                if (e.dataTransfer) {
                    e.dataTransfer.effectAllowed = 'move';
                    // Required by Firefox to actually start the drag.
                    try { e.dataTransfer.setData('text/plain', row.getAttribute('data-id')); } catch (_) {}
                }
            });
            row.addEventListener('dragend', function () {
                if (dragged) dragged.classList.remove('opacity-50');
                dragged = null;
            });
            row.addEventListener('dragover', function (e) {
                e.preventDefault();
                if (!dragged || dragged === row) return;
                var rect = row.getBoundingClientRect();
                var midY = rect.top + rect.height / 2;
                if (e.clientY < midY) {
                    tbody.insertBefore(dragged, row);
                } else {
                    tbody.insertBefore(dragged, row.nextSibling);
                }
            });
            row.addEventListener('drop', function (e) {
                e.preventDefault();
                commitOrder();
            });
        });

        function commitOrder() {
            var ids = Array.prototype.map.call(rows(), function (r) {
                return r.getAttribute('data-id');
            }).filter(Boolean);
            if (status) { status.classList.remove('hidden'); status.textContent = '並び順を保存しています…'; }
            var fd = new FormData();
            ids.forEach(function (id) { fd.append('ids', id); });
            fetch('/manager/settings/message-templates/reorder', {
                method: 'POST',
                credentials: 'same-origin',
                body: fd
            }).then(function (r) {
                if (status) {
                    if (r.ok) {
                        status.textContent = '✓ 並び順を保存しました';
                        setTimeout(function () { status.classList.add('hidden'); }, 1500);
                    } else {
                        status.textContent = '✗ 並び順の保存に失敗しました (HTTP ' + r.status + ')';
                    }
                }
            }).catch(function (e) {
                if (status) status.textContent = '✗ 通信エラー: ' + e.message;
            });
        }
    })();
    </script>
</section>
</body>
</html>
