<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>送信者名設定</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">送信者名設定</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
           th:href="@{/manager/settings}">設定に戻る</a>
    </div>

    <p class="text-sm text-slate-500 mb-4">
        送信メールの From ヘッダに付ける表示名を設定します。同じ送信者名が続くとキャリアのフィルタに引っかかりやすいので、
        ランダムなリスト・自動生成で変動させてフィルタリング対策に使えます。
    </p>

    <form method="post" th:action="@{/manager/settings/sender-names}"
          class="bg-white rounded-lg shadow-sm border border-slate-100 p-6 space-y-6 max-w-3xl">
        <input type="hidden" name="_csrf" th:value="${_csrf}"/>

        <!-- Mode selector -->
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">モード</label>
            <div class="space-y-2">
                <label class="flex items-start gap-2 cursor-pointer">
                    <input type="radio" name="mode" value="none" th:checked="${mode == 'none'}" class="mt-1"/>
                    <span><strong>なし</strong> — 表示名を付けず、メールアドレスのみ送信します (デフォルト)</span>
                </label>
                <label class="flex items-start gap-2 cursor-pointer">
                    <input type="radio" name="mode" value="fixed" th:checked="${mode == 'fixed'}" class="mt-1"/>
                    <span><strong>固定</strong> — 下記の固定表示名を毎回使用します</span>
                </label>
                <label class="flex items-start gap-2 cursor-pointer">
                    <input type="radio" name="mode" value="list" th:checked="${mode == 'list'}" class="mt-1"/>
                    <span><strong>リストからランダム</strong> — 下記30件のリストから1つをランダムに選んで使用します</span>
                </label>
                <label class="flex items-start gap-2 cursor-pointer">
                    <input type="radio" name="mode" value="random" th:checked="${mode == 'random'}" class="mt-1"/>
                    <span><strong>ランダム英数字</strong> — 毎回ランダムな英数字を生成します</span>
                </label>
            </div>
        </div>

        <!-- Fixed value -->
        <div class="border-t border-slate-100 pt-4">
            <label class="block text-sm font-semibold text-slate-700 mb-1">固定表示名</label>
            <input type="text" name="fixed" th:value="${fixed}" maxlength="120"
                   class="w-full px-3 py-2 text-sm border border-slate-300 rounded-md"
                   placeholder="例: 山田太郎"/>
            <p class="text-xs text-slate-500 mt-1">「固定」モード選択時のみ使用されます。</p>
        </div>

        <!-- List of names -->
        <div class="border-t border-slate-100 pt-4">
            <label class="block text-sm font-semibold text-slate-700 mb-1">表示名リスト (最大30件、1行に1つ)</label>
            <textarea name="listText" rows="12"
                      class="w-full px-3 py-2 text-sm border border-slate-300 rounded-md font-mono"
                      th:text="${listText}"
                      placeholder="山田太郎&#10;田中花子&#10;佐藤次郎&#10;..."></textarea>
            <p class="text-xs text-slate-500 mt-1">「リストからランダム」モード選択時に1件ずつランダムに選ばれます。空行は無視されます。</p>
        </div>

        <!-- Random alphanumeric options -->
        <div class="border-t border-slate-100 pt-4">
            <label class="block text-sm font-semibold text-slate-700 mb-2">ランダム英数字オプション</label>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-500 mb-1">文字数 (4〜32)</label>
                    <input type="number" name="randomLength" th:value="${randomLength}" min="4" max="32"
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-md"/>
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">大文字小文字</label>
                    <select name="randomCase" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-md bg-white">
                        <option value="lower" th:selected="${randomCase == 'lower'}">小文字のみ</option>
                        <option value="upper" th:selected="${randomCase == 'upper'}">大文字のみ</option>
                        <option value="mixed" th:selected="${randomCase == 'mixed'}">大文字+小文字</option>
                    </select>
                </div>
            </div>
            <p class="text-xs text-slate-500 mt-2">
                例 (8文字, 大文字+小文字): <code class="bg-slate-100 px-1 rounded">aB3kP9qR</code>
            </p>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
            <button type="submit" class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow-sm">
                保存
            </button>
        </div>
    </form>
</section>
</body>
</html>
