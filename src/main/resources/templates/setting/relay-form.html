<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${editing} ? 'リレーサーバー編集' : 'リレーサーバー追加'">リレーサーバー</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1"
            th:text="${editing} ? 'リレーサーバー編集' : 'リレーサーバー追加'"></h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md" th:href="@{/manager/settings/relay-servers}">一覧に戻る</a>
    </div>

    <form method="post"
          th:action="${editing} ? @{'/manager/settings/relay-servers/' + ${relayId}} : @{/manager/settings/relay-servers}"
          th:object="${form}"
          class="bg-white rounded-lg shadow-sm border border-slate-100 p-6" style="max-width: 640px;">

        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">名前 <span class="text-red-500">*</span></label>
            <input type="text" class="tw-input" th:field="*{name}"
                   placeholder="例: 転送機1"
                   th:classappend="${#fields.hasErrors('name')} ? 'border-red-400'"/>
            <p class="text-sm text-red-600 mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-slate-700 mb-1">IPアドレス <span class="text-red-500">*</span></label>
                <input type="text" class="tw-input" th:field="*{ipAddress}"
                       placeholder="例: 133.88.116.190"
                       th:classappend="${#fields.hasErrors('ipAddress')} ? 'border-red-400'"/>
                <p class="text-sm text-red-600 mt-1" th:if="${#fields.hasErrors('ipAddress')}" th:errors="*{ipAddress}"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">ポート <span class="text-red-500">*</span></label>
                <input type="number" class="tw-input" th:field="*{port}"
                       placeholder="例: 587"
                       th:classappend="${#fields.hasErrors('port')} ? 'border-red-400'"/>
                <p class="text-sm text-red-600 mt-1" th:if="${#fields.hasErrors('port')}" th:errors="*{port}"></p>
            </div>
        </div>

        <div class="mb-4 flex items-center">
            <input type="checkbox" class="h-4 w-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500" id="isActive" th:field="*{isActive}"/>
            <label class="ml-2 text-sm text-slate-700" for="isActive">有効にする</label>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">メモ</label>
            <textarea class="tw-input" rows="3" th:field="*{memo}"
                      placeholder="補足事項 (任意)"></textarea>
        </div>

        <div class="flex items-center gap-3">
            <button type="submit" class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow-sm"
                    th:text="${editing} ? '更新する' : '追加する'"></button>
            <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md" th:href="@{/manager/settings/relay-servers}">キャンセル</a>
        </div>
    </form>
</section>
</body>
</html>
