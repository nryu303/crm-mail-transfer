<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>操作ログ</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">操作ログ</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md" th:href="@{/manager/settings}">設定に戻る</a>
    </div>

    <p class="text-sm text-slate-500 mb-4">
        管理画面の主要操作 (ログイン、管理者パスワード変更、ユーザー削除、キャリアアドレス追加/削除、一斉送信、入金処理など) の履歴が残ります。
        ログは 1ヶ月で自動的に削除されます（毎日04:00JSTのバッチで30日経過行を削除）。
    </p>

    <div class="bg-white rounded-lg shadow-sm border border-slate-100 overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50 text-xs text-slate-500 uppercase tracking-wider">
            <tr>
                <th class="px-3 py-2 text-left" style="width: 170px;">日時</th>
                <th class="px-3 py-2 text-left">操作</th>
                <th class="px-3 py-2 text-left">対象</th>
                <th class="px-3 py-2 text-left">実行者</th>
                <th class="px-3 py-2 text-left">IP</th>
                <th class="px-3 py-2 text-left">詳細</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:if="${logs.empty}">
                <td colspan="6" class="px-3 py-6 text-center text-slate-400">操作ログはまだありません</td>
            </tr>
            <!-- Per-row color tag is computed from the action's prefix. Login family = emerald,
                 user family = blue, carrier = cyan, broadcast = violet, payment = lime,
                 settings/password = amber, login-fail = red. Falls back to slate. -->
            <tr th:each="l : ${logs.content}" class="hover:bg-slate-50">
                <td class="px-3 py-2 text-xs text-slate-500" th:text="${#temporals.format(l.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td class="px-3 py-2">
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold"
                          th:with="a=${l.action}"
                          th:classappend="${a == 'LOGIN_FAIL'} ? 'bg-red-100 text-red-700' :
                                          (${a == 'LOGIN_OK' or a == 'LOGOUT'} ? 'bg-emerald-100 text-emerald-700' :
                                          (${a == 'ADMIN_PASSWORD_CHANGE' or a == 'SETTINGS_UPDATE'} ? 'bg-amber-100 text-amber-800' :
                                          (${a != null and #strings.startsWith(a, 'USER_')} ? 'bg-blue-100 text-blue-700' :
                                          (${a != null and #strings.startsWith(a, 'CARRIER_')} ? 'bg-cyan-100 text-cyan-700' :
                                          (${a != null and #strings.startsWith(a, 'BROADCAST_')} ? 'bg-violet-100 text-violet-700' :
                                          (${a != null and #strings.startsWith(a, 'PAYMENT_')} ? 'bg-lime-100 text-lime-700' :
                                          (${a != null and #strings.startsWith(a, 'MESSAGE_')} ? 'bg-sky-100 text-sky-700' : 'bg-slate-100 text-slate-700')))))))"
                          th:text="${l.action}"></span>
                </td>
                <td class="px-3 py-2 text-xs text-slate-600"
                    th:text="${l.entityType != null ? l.entityType + ' #' + (l.entityId != null ? l.entityId : '-') : '-'}"></td>
                <td class="px-3 py-2 text-xs text-slate-700" th:text="${l.adminName} ?: '-'"></td>
                <td class="px-3 py-2 text-xs text-slate-500" th:text="${l.ipAddress} ?: '-'"></td>
                <td class="px-3 py-2 text-xs text-slate-500 truncate" style="max-width: 360px;" th:text="${l.detail}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-4" th:if="${logs.totalPages > 1}">
        <ul class="flex items-center gap-1 text-sm">
            <li>
                <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                   th:classappend="${logs.first} ? 'opacity-50 pointer-events-none'"
                   th:href="@{/manager/settings/audit-log(page=${logs.number - 1})}">前へ</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, logs.totalPages - 1)}">
                <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                   th:classappend="${i == logs.number} ? 'bg-blue-600 text-white border-blue-600'"
                   th:href="@{/manager/settings/audit-log(page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li>
                <a class="px-3 py-1 border border-slate-300 rounded hover:bg-slate-50"
                   th:classappend="${logs.last} ? 'opacity-50 pointer-events-none'"
                   th:href="@{/manager/settings/audit-log(page=${logs.number + 1})}">次へ</a>
            </li>
        </ul>
    </nav>
    <p class="mt-3 text-sm text-slate-500">全<span th:text="${logs.totalElements}">0</span>件</p>
</section>
</body>
</html>
