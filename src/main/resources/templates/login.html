<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ログイン | CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-start justify-center pt-24">
<div class="w-full max-w-sm">
    <div class="bg-white rounded-lg shadow p-6">
        <h1 class="text-center text-xl font-semibold text-slate-800 mb-6">CRM 管理画面</h1>

        <div th:if="${errorMessage}" class="mb-4 rounded-md bg-red-50 border border-red-200 px-3 py-2 text-sm text-red-700" th:text="${errorMessage}"></div>

        <form th:action="@{/manager/login}" method="post" class="space-y-4">
            <div>
                <label for="loginId" class="block text-sm font-medium text-slate-700 mb-1">ログインID</label>
                <input type="text" id="loginId" name="loginId" th:value="${loginId}" required autofocus
                       class="block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"/>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">パスワード</label>
                <input type="password" id="password" name="password" required
                       class="block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"/>
            </div>
            <button type="submit"
                    class="w-full inline-flex justify-center items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow-sm">
                ログイン
            </button>
        </form>
    </div>
</div>
</body>
</html>
