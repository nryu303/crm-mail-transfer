<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>広告コード新規発行</title>
</head>
<body>
<section layout:fragment="content">
    <div class="flex items-center mb-4">
        <h1 class="text-2xl font-semibold text-slate-800 flex-1">広告コード新規発行</h1>
        <a class="inline-flex items-center px-3 py-1.5 text-sm border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
           th:href="@{/manager/ad-codes}">一覧に戻る</a>
    </div>

    <p class="text-sm text-slate-500 mb-4">
        広告コードと外部URL用アクセストークンは保存時に自動生成されます。
    </p>

    <form method="post" th:action="@{/manager/ad-codes}" class="bg-white rounded-lg shadow-sm border border-slate-100 p-6 space-y-4 max-w-2xl">
        <input type="hidden" name="_csrf" th:value="${_csrf}"/>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">グループ名 <span class="text-red-600">*</span></label>
            <input type="text" name="name" class="tw-input" required maxlength="255" placeholder="例: 開運I、〇〇代理店、〇〇キャンペーン"/>
            <p class="text-xs text-slate-500 mt-1">
                同じグループ名を複数の広告コードに付けると、そのグループ単位で代理店向け管理画面が発行されます。
            </p>
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">広告コード <span class="text-slate-400 normal-case">(任意)</span></label>
            <input type="text" name="code" class="tw-input" maxlength="64"
                   pattern="[A-Za-z0-9_\-]+" placeholder="例: kaiun_I_mail （半角英数字 _ - のみ。空欄ならランダム自動生成）"/>
            <p class="text-xs text-slate-500 mt-1">代理店ダッシュボードで識別子として表示されるコードです。空欄の場合は自動生成。重複不可。</p>
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">メモ</label>
            <textarea name="memo" class="tw-input" rows="4" placeholder="任意。担当者・契約内容・更新時期など"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
            <a class="inline-flex items-center px-4 py-2 border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md"
               th:href="@{/manager/ad-codes}">キャンセル</a>
            <button type="submit" class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow-sm">
                発行する
            </button>
        </div>
    </form>
</section>
</body>
</html>
