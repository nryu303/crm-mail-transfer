<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>送信完了</title>
    <link rel="stylesheet" th:href="@{/css/reply.css}"/>
</head>
<body>
<div class="reply-shell">
    <div class="reply-banner">
        <h1>送信完了</h1>
    </div>
    <div class="reply-form">
        <p class="sent-message">メールを送信しました。</p>
        <div th:if="${cameFromMessageBox}" class="actions">
            <a th:href="@{'/reply/' + ${token}}" class="message-box-back-link">メッセージボックスに戻る</a>
        </div>
    </div>
</div>
</body>
</html>
