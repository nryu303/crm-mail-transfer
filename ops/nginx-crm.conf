upstream crm_backend {
    server 127.0.0.1:50000;
    keepalive 16;
}

# -- HTTP redirect for avu74g.jp → HTTPS -----------------------------------
server {
    listen       80;
    server_name  avu74g.jp;
    return 301 https://$server_name$request_uri;
}

# -- HTTP catch-all (legacy random-subdomain reply URLs already sent over HTTP)
#    These have no valid TLS cert so we keep serving them over HTTP rather
#    than break them. Going forward, all new reply URLs use avu74g.jp/HTTPS.
server {
    listen       80 default_server;
    server_name  _;

    client_max_body_size 20m;

    location / {
        proxy_pass              http://crm_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_connect_timeout   10s;
        proxy_send_timeout      30s;
        proxy_read_timeout      600s;
    }

    location = /api/inbound/receive-raw {
        allow 160.251.233.64;
        allow 160.251.180.110;
        allow 160.16.231.39;
        allow 157.7.89.36;
        allow 133.88.116.190;
        deny  all;

        proxy_pass              http://crm_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }
}

# -- HTTPS primary --------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name  avu74g.jp;

    ssl_certificate     /etc/letsencrypt/live/avu74g.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avu74g.jp/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass              http://crm_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_connect_timeout   10s;
        proxy_send_timeout      30s;
        proxy_read_timeout      600s;
    }

    location = /api/inbound/receive-raw {
        allow 160.251.233.64;
        allow 160.251.180.110;
        allow 160.16.231.39;
        allow 157.7.89.36;
        allow 133.88.116.190;
        deny  all;

        proxy_pass              http://crm_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }
}
