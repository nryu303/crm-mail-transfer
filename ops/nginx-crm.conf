upstream crm_backend {
    server 127.0.0.1:50000;
    keepalive 16;
}

# -- HTTP redirect for avu74g.jp → HTTPS -----------------------------------
server {
    listen       80;
    server_name  avu74g.jp;
    server_tokens off;
    return 301 https://$server_name$request_uri;
}

# -- HTTP catch-all (legacy random-subdomain reply URLs already sent over HTTP)
#    These have no valid TLS cert so we keep serving them over HTTP rather
#    than break them. Going forward, all new reply URLs use avu74g.jp/HTTPS.
server {
    listen       80 default_server;
    server_name  _;
    server_tokens off;

    # Minimum security headers for the legacy HTTP path. No HSTS here — that header
    # is only meaningful on HTTPS responses, and we deliberately keep HTTP open for
    # already-issued random-subdomain reply URLs that have no valid TLS cert.
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    location / {
        proxy_pass              http://crm_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_connect_timeout   10s;
        proxy_send_timeout      30s;
        proxy_read_timeout      3600s;
    }

    location = /api/inbound/receive-raw {
        allow 160.251.233.64;
        allow 160.251.180.110;
        allow 160.16.231.39;
        allow 157.7.89.36;
        allow 133.88.116.190;
        deny  all;

        proxy_pass              http://crm_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }
}

# -- HTTPS primary --------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name  avu74g.jp;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/avu74g.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avu74g.jp/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers. HSTS without includeSubDomains is deliberate — the legacy
    # random-subdomain reply URLs at port 80 must keep working, and includeSubDomains
    # would block them browser-side after the first HTTPS visit. preload is omitted
    # for the same reason. X-Frame-Options=SAMEORIGIN allows the in-app reply-preview
    # iframe used by the management UI; DENY would break that.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    location / {
        proxy_pass              http://crm_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_connect_timeout   10s;
        proxy_send_timeout      30s;
        proxy_read_timeout      3600s;
    }

    location = /api/inbound/receive-raw {
        allow 160.251.233.64;
        allow 160.251.180.110;
        allow 160.16.231.39;
        allow 157.7.89.36;
        allow 133.88.116.190;
        deny  all;

        proxy_pass              http://crm_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }
}
